  <!-- Prevenir flashazo del modo oscuro -->
  <script>
    (function() {
      const saved = localStorage.getItem('fs_dark_mode');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldBeDark = saved === null ? prefersDark : saved === 'true';
      if (shouldBeDark) {
        document.documentElement.classList.add('dark-mode');
        document.body.classList.add('dark-mode');
      }
    })();
  </script>

  <style>
    /* (estilos específicos para inventario) */
    .tarjetas-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      padding: 12px;
      box-sizing: border-box;
      align-content: start;
      max-height: calc(100vh - 240px);
      overflow: auto;
      border-radius: 10px;
      background: transparent;
    }

    .tarjetas-container .tarjeta {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 98%, transparent 2%), transparent);
      box-shadow: 0 6px 18px rgba(16,34,31,0.03);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 92px;
    }

    .tarjetas-container .tarjeta h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.1;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .tarjetas-container .tarjeta p { margin:0; font-size:12px; color:var(--muted); }

    .tarjetas-container .tarjeta .acciones { margin-top:6px; display:flex; gap:8px; justify-content:flex-end; }

    .card-qr { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .card-qr img { width:72px; height:72px; object-fit:contain; border-radius:6px; border:1px solid #ddd; background:#fff; }

    .modal-qr { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
    .modal-qr img { max-width:140px; max-height:140px; border-radius:6px; border:1px solid #eee; background:#fff; }

    @media (max-width:560px) {
      .tarjetas-container { grid-template-columns: 1fr; max-height: calc(100vh - 220px); }
      .tarjetas-container .tarjeta { min-height:110px; }
    }

    /* Modal de confirmación personalizado */
    .confirm-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 15000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .confirm-modal-backdrop.show {
      display: flex;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .confirm-modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 0;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transform: scale(0.9) translateY(-20px);
      animation: modalBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      overflow: hidden;
    }

    @keyframes modalBounce {
      to {
        transform: scale(1) translateY(0);
      }
    }

    .confirm-modal-header {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .confirm-modal-icon {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-5deg); }
      75% { transform: translateX(10px) rotate(5deg); }
    }

    .confirm-modal-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

        #closeModalInv{
      background-color: #ee5a6f;
    }

    .confirm-modal-body {
      padding: 24px;
      color: var(--text);
    }

    .confirm-modal-message {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .confirm-modal-detail {
      background: var(--card-bg);
      border-left: 3px solid #ff6b6b;
      padding: 12px 16px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      color: var(--text);
    }

    .confirm-modal-footer {
      padding: 16px 24px 24px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .confirm-modal-btn {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .confirm-modal-btn-cancel {
      background: var(--card-bg);
      color: var(--text);
    }

    .confirm-modal-btn-cancel:hover {
      background: var(--hover-bg);
      transform: translateY(-1px);
    }

    .confirm-modal-btn-confirm {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
    }

    .confirm-modal-btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
    }

    .confirm-modal-btn:active {
      transform: translateY(0);
    }


  </style>

<script>
// Funciones utilitarias globales
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseIsoToDate(str) {
  if (!str) return null;
  const d = new Date(str);
  if (isNaN(d)) return null;
  return d;
}
function renderCard(h) {
  const fechaDisplay = h.fecha ? (parseIsoToDate(h.fecha) ? parseIsoToDate(h.fecha).toLocaleDateString() : h.fecha) : '-';
  const div = document.createElement('div');
  div.className = 'tarjeta herramienta-card';
  div.innerHTML = `
    <h3>${escapeHtml(h.nombre)}</h3>
    <p><strong>Estado:</strong> ${escapeHtml(h.estado)}</p>
    <p><strong>Tipo:</strong> ${escapeHtml(h.tipo)}</p>
    <p><strong>Ubicación:</strong> ${escapeHtml(h.ubicacion)}</p>
    <p><strong>Fecha ingreso:</strong> ${escapeHtml(fechaDisplay)}</p>
    <p><strong>Lote:</strong> ${escapeHtml(h.lote)}</p>
    <p><strong>Cantidad:</strong> ${escapeHtml(String(h.cantidad))}</p>
    <div class="acciones">
      <button class="btn-small detalles" data-id="${escapeHtml(h.idHerramienta || h.id)}" data-nombre="${escapeHtml(h.nombre)}">Ver detalles</button>
      <button class="btn-small editar" data-id="${escapeHtml(h.idHerramienta || h.id)}" data-nombre="${escapeHtml(h.nombre)}">Editar</button>
      <button class="btn-small delete eliminar" data-id="${escapeHtml(h.idHerramienta || h.id)}">Eliminar</button>
    </div>
  `;
  if (Array.isArray(h.detalles) && h.detalles.length > 0) {
    const primerDetalle = h.detalles[0];
    const codigo = primerDetalle.codigoUnico || primerDetalle.codigo || primerDetalle.idDetalle || null;
    if (codigo) {
      const qrContainer = document.createElement('div');
      qrContainer.className = 'card-qr';
      const smallImg = document.createElement('img');
      smallImg.src = '';
      smallImg.alt = 'QR';
      const txt = document.createElement('div');
      txt.innerHTML = '<small>' + escapeHtml(codigo) + '</small>';
      qrContainer.appendChild(smallImg);
      qrContainer.appendChild(txt);
      div.insertBefore(qrContainer, div.firstChild);
    }
  }
  return div;
}

(function() {
  var BACKEND = 'http://127.0.0.1:8080';
  var HERR_URL = BACKEND + '/herramienta';
  var contenedor = document.getElementById('inventarioLista');
  var tipoFiltro = document.getElementById('tipoFiltro');
  var buscarCodigoInput = document.getElementById('buscarCodigo');
  var buscarCodigoInformeInput = document.getElementById('buscarCodigoInforme');

  tipoFiltro.addEventListener('change', function() {
    if (this.value === 'codigo') {
      buscarCodigoInput.style.display = '';
      buscarCodigoInformeInput.style.display = 'none';
      buscarCodigoInput.focus();
    } else {
      buscarCodigoInput.style.display = 'none';
      buscarCodigoInformeInput.style.display = '';
      buscarCodigoInformeInput.focus();
    }
  });

  // Filtro por código informe
  let timeoutBusquedaInforme = null;
  buscarCodigoInformeInput.addEventListener('input', function() {
    clearTimeout(timeoutBusquedaInforme);
    const codigo = this.value.trim();
    timeoutBusquedaInforme = setTimeout(function() {
      if (tipoFiltro.value !== 'informe') return;
      if (!codigo) {
        contenedor.innerHTML = '<p style="color:#b00020;">Debes ingresar un código de informe.</p>';
        return;
      }
      fetch(HERR_URL + '/codigo-informe/' + encodeURIComponent(codigo), {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(function(res) {
        if (!res.ok) return res.text().then(function(msg) { throw new Error(msg); });
        return res.json();
      })
      .then(function(herramientas) {
        if (!herramientas || herramientas.length === 0) {
          contenedor.innerHTML = '<p>No se encontraron herramientas para ese código de informe.</p>';
          return;
        }
        contenedor.innerHTML = '';
        var grid = document.createElement('div');
        grid.className = 'tarjetas-container';
        herramientas.forEach(function(h) {
          grid.appendChild(renderCard(h));
        });
        contenedor.appendChild(grid);
      })
      .catch(function(err) {
        contenedor.innerHTML = '<p style="color:#b00020;">Error: ' + (err.message || err) + '</p>';
      });
    }, 300);
  });

  // Filtro por código único
  let timeoutBusqueda = null;
  buscarCodigoInput.addEventListener('input', function() {
    clearTimeout(timeoutBusqueda);
    const codigo = this.value.trim();
    timeoutBusqueda = setTimeout(() => {
      if (!codigo) {
        contenedor.innerHTML = '<p style="color:#b00020;">Debes ingresar un código único.</p>';
        return;
      }
      fetch(HERR_URL + '/buscar?codigoUnico=' + encodeURIComponent(codigo), {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(function(res) {
        if (!res.ok) return res.text().then(function(msg) { throw new Error(msg); });
        return res.json();
      })
      .then(function(herramientas) {
        if (!herramientas || herramientas.length === 0) {
          contenedor.innerHTML = '<p>No se encontraron herramientas para ese código único.</p>';
          return;
        }
        contenedor.innerHTML = '';
        var grid = document.createElement('div');
        grid.className = 'tarjetas-container';
        herramientas.forEach(function(h) {
          grid.appendChild(renderCard(h));
        });
        contenedor.appendChild(grid);
      })
      .catch(function(err) {
        contenedor.innerHTML = '<p style="color:#b00020;">Error: ' + (err.message || err) + '</p>';
      });
    }, 300);
  });

})();
</script>

    <script>
    (function () {
      const API = window.FSApiClient;
      const contenedor = document.getElementById('inventarioLista');
      const buscarCodigoInput = document.getElementById('buscarCodigo');
      const modalBackdrop = document.getElementById('modalBackdropInv');
      const modalContent = document.getElementById('modalContentInv');
      const modalTitle = document.getElementById('modalTitleInv');
      const closeModalBtn = document.getElementById('closeModalInv');

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function parseIsoToDate(str) {
        if (!str) return null;
        const d = new Date(str);
        if (isNaN(d)) return null;
        return d;
      }
      function normalizeTool(h) {
        const idVal = h.idHerramienta || h.id || h.id_herramienta || h.idHerr || null;
        return {
          idHerramienta: idVal,
          id: idVal,
          nombre: h.nombre || h.name || '',
          estado: h.estado || '',
          tipo: h.tipo || '',
          ubicacion: h.ubicacion || '',
          fecha: h.fecha_registro || h.fechaRegistro || h.fecha || '',
          lote: h.numero_lote || h.numeroLote || h.lote || '',
          cantidad: (h.cantidad != null) ? h.cantidad : (h.cantidad || 0),
          descripcion: h.descripcion || h.desc || '',
          detalles: h.detalles || [],
          codigoInforme: h.codigoInforme || h.codigo_informe || ''
        };
      }

      // ===== CONFIG: BACKEND en local =====
      const BACKEND_BASE = 'http://127.0.0.1:8080'; // <-- backend local
      function ensureNoSlash(u){ return u && u.endsWith('/') ? u.slice(0,-1) : u; }
      const BACKEND = ensureNoSlash(BACKEND_BASE);

      // ===== MODAL DE CONFIRMACIÓN PERSONALIZADO =====
      function showConfirmModal(message, detail) {
        return new Promise((resolve) => {
          const backdrop = document.getElementById('confirmModalBackdrop');
          const messageEl = document.getElementById('confirmModalMessage');
          const detailEl = document.getElementById('confirmModalDetail');
          const confirmBtn = document.getElementById('confirmModalConfirm');
          const cancelBtn = document.getElementById('confirmModalCancel');

          messageEl.textContent = message;
          detailEl.textContent = detail;

          backdrop.classList.add('show');

          const handleConfirm = () => {
            backdrop.classList.remove('show');
            setTimeout(() => backdrop.style.display = 'none', 300);
            cleanup();
            resolve(true);
          };

          const handleCancel = () => {
            backdrop.classList.remove('show');
            setTimeout(() => backdrop.style.display = 'none', 300);
            cleanup();
            resolve(false);
          };

          const handleEscape = (e) => {
            if (e.key === 'Escape') handleCancel();
          };

          const cleanup = () => {
            confirmBtn.removeEventListener('click', handleConfirm);
            cancelBtn.removeEventListener('click', handleCancel);
            backdrop.removeEventListener('click', handleBackdropClick);
            document.removeEventListener('keydown', handleEscape);
          };

          const handleBackdropClick = (e) => {
            if (e.target === backdrop) handleCancel();
          };

          confirmBtn.addEventListener('click', handleConfirm);
          cancelBtn.addEventListener('click', handleCancel);
          backdrop.addEventListener('click', handleBackdropClick);
          document.addEventListener('keydown', handleEscape);
        });
      }

      // Construye URL absoluta para QR por CÓDIGO UNICO (archivo en backend: qr_<CODIGO>.png)
      function qrUrlForCodigo(codigoUnico) {
        if (!codigoUnico) return '';
        const file = encodeURIComponent('qr_' + codigoUnico) + '.png';
        return BACKEND + '/qr/' + file;
      }

      // Construye URL absoluta para QR por NOMBRE de herramienta (si es que guardaste por nombre)
      function qrUrlForToolName(toolName) {
        if (!toolName) return '';
        const file = encodeURIComponent(toolName) + '.png';
        return BACKEND + '/qr/' + file;
      }

      // Helper: crear imagen pequeña (para tarjeta)
      function createSmallQrImg(codigoUnico) {
        const img = document.createElement('img');
        const src = qrUrlForCodigo(codigoUnico);
        img.src = src;
        img.alt = 'QR ' + (codigoUnico || '');
        img.onerror = function() { console.warn('[QR] not found:', src); this.style.display = 'none'; };
        img.onload = function() { /* ok */ };
        console.log('[QR] small img src ->', src);
        return img;
      }

      // Helper: crear bloque QR para modal
      function createQrElement(qrImgUrl, titleText, idText) {
        const qrDiv = document.createElement('div');
        qrDiv.className = 'modal-qr';

        const imgWrap = document.createElement('div');
        const img = document.createElement('img');
        img.src = qrImgUrl || '';
        img.alt = 'QR';
        img.onerror = function() { console.warn('[QR] modal not found:', qrImgUrl); this.style.display = 'none'; };
        imgWrap.appendChild(img);
        qrDiv.appendChild(imgWrap);

        const infoDiv = document.createElement('div');
        infoDiv.innerHTML = '<strong>' + escapeHtml(titleText || '') + '</strong><br/><small>ID: ' + escapeHtml(String(idText || '')) + '</small>';
        qrDiv.appendChild(infoDiv);

        console.log('[QR] modal img src ->', qrImgUrl);
        return qrDiv;
      }

      // Obtener detalles de herramientas desde el backend
      async function fetchAllToolsWithDetails() {
        try {
          const response = await fetch(BACKEND + '/api/herramienta-detalle');
          if (response.ok) {
            const detalles = await response.json();
            console.log('📦 Detalles cargados:', detalles);
            return Array.isArray(detalles) ? detalles : [];
          }
          console.warn('No se pudieron cargar detalles del backend');
          return [];
        } catch (e) {
          console.warn('Error al cargar detalles:', e);
          return [];
        }
      }

      async function fetchAllTools() {
        try {
          console.log('📡 Cargando herramientas desde:', BACKEND + '/herramienta');
          const response = await fetch(BACKEND + '/herramienta');
          
          if (!response.ok) {
            throw new Error('Backend no responde: ' + response.status);
          }
          
          const herramientas = await response.json();
          console.log('✅ Herramientas recibidas:', herramientas.length);
          
          // Cargar detalles para cada herramienta
          const herramientasConDetalles = await Promise.all(
            herramientas.map(async (h) => {
              const normalized = normalizeTool(h);
              try {
                const detailsUrl = BACKEND + '/api/herramienta-detalle/herramienta/' + h.idHerramienta;
                console.log('📦 Cargando detalles de:', h.nombre, 'desde:', detailsUrl);
                const detailsResponse = await fetch(detailsUrl);
                
                if (detailsResponse.ok) {
                  const detalles = await detailsResponse.json();
                  normalized.detalles = detalles;
                  console.log('✅ Detalles cargados para', h.nombre + ':', detalles.length, 'unidades');
                } else {
                  console.warn('⚠️ No hay detalles para', h.nombre);
                  normalized.detalles = [];
                }
              } catch (err) {
                console.warn('❌ Error al cargar detalles de', h.nombre + ':', err);
                normalized.detalles = [];
              }
              return normalized;
            })
          );
          
          console.log('🎉 Total herramientas con detalles:', herramientasConDetalles.length);
          return herramientasConDetalles;
          
        } catch (e) {
          console.error('❌ Error al conectar con backend:', e);

      function loadToolsFromLocal() {
        try {
          const raw = localStorage.getItem('fs_local_tools_v1');
          if (raw) return JSON.parse(raw).map(normalizeTool);
        } catch (e) {}
        try {
          const raw = localStorage.getItem('herramientas');
          if (raw) return JSON.parse(raw).map(normalizeTool);
        } catch (e) {}
        return [];
      }

      function renderCard(h) {
        const fechaDisplay = h.fecha ? (parseIsoToDate(h.fecha) ? parseIsoToDate(h.fecha).toLocaleDateString() : h.fecha) : '-';
        const div = document.createElement('div');
        div.className = 'tarjeta herramienta-card';
        div.innerHTML = `
          <h3>${escapeHtml(h.nombre)}</h3>
          <p><strong>Estado:</strong> ${escapeHtml(h.estado)}</p>
          <p><strong>Tipo:</strong> ${escapeHtml(h.tipo)}</p>
          <p><strong>Ubicación:</strong> ${escapeHtml(h.ubicacion)}</p>
          <p><strong>Fecha ingreso:</strong> ${escapeHtml(fechaDisplay)}</p>
          <p><strong>Lote:</strong> ${escapeHtml(h.lote)}</p>
          <p><strong>Cantidad:</strong> ${escapeHtml(String(h.cantidad))}</p>
          <div class="acciones">
            <button class="btn-small detalles" data-id="${escapeHtml(h.idHerramienta || h.id)}" data-nombre="${escapeHtml(h.nombre)}">Ver detalles</button>
            <button class="btn-small editar" data-id="${escapeHtml(h.idHerramienta || h.id)}" data-nombre="${escapeHtml(h.nombre)}">Editar</button>
            <button class="btn-small delete eliminar" data-id="${escapeHtml(h.idHerramienta || h.id)}">Eliminar</button>
          </div>
        `;

        // mostrar QR pequeño (si hay detalles, tomar el primer detalle)
        if (Array.isArray(h.detalles) && h.detalles.length > 0) {
          const primerDetalle = h.detalles[0];
          const codigo = primerDetalle.codigoUnico || primerDetalle.codigo || primerDetalle.idDetalle || null;
          if (codigo) {
            const qrContainer = document.createElement('div');
            qrContainer.className = 'card-qr';
            const smallImg = createSmallQrImg(codigo);
            const txt = document.createElement('div');
            txt.innerHTML = '<small>' + escapeHtml(codigo) + '</small>';
            qrContainer.appendChild(smallImg);
            qrContainer.appendChild(txt);
            div.insertBefore(qrContainer, div.firstChild);
          }
        }

        return div;
      }

      function applyCodeFilter(items, codigoBusqueda, todosDetalles) {
        if (!codigoBusqueda || codigoBusqueda.trim() === '') return items;
        
        const termino = codigoBusqueda.trim().toLowerCase();
        console.log('🔍 Buscando por código:', termino);
        
        // Filtrar detalles que coincidan con el código buscado
        const detallesFiltrados = todosDetalles.filter(detalle => {
          const codigo = (detalle.codigoUnico || '').toLowerCase();
          return codigo.includes(termino);
        });
        
        console.log('📋 Detalles encontrados:', detallesFiltrados);
        
        // Obtener IDs de herramientas que tienen esos códigos
        const idsHerramientas = [...new Set(detallesFiltrados.map(d => 
          d.herramienta?.idHerramienta || d.herramienta?.id
        ))].filter(Boolean);
        
        console.log('🔑 IDs de herramientas:', idsHerramientas);
        
        // Filtrar herramientas que coincidan
        return items.filter(h => 
          idsHerramientas.includes(h.idHerramienta || h.id)
        );
      }

      async function mostrarInventario(codigoBusqueda = '') {
        contenedor.innerHTML = '<p>Cargando inventario...</p>';
        console.log('🔄 Iniciando carga de inventario...');
        
        let all = [];
        try { 
          all = await fetchAllTools(); 
          console.log('✅ Herramientas cargadas:', all.length);
        } catch (e) { 
          console.error('❌ Error:', e);
          all = loadToolsFromLocal(); 
        }
        
        let mostrados = all;
        
        // Aplicar filtro de búsqueda por código único
        if (codigoBusqueda && codigoBusqueda.trim() !== '') {
          const todosDetalles = await fetchAllToolsWithDetails();
          mostrados = applyCodeFilter(all, codigoBusqueda, todosDetalles);
        }
        
        contenedor.innerHTML = '';
        if (!mostrados || mostrados.length === 0) {
          if (codigoBusqueda && codigoBusqueda.trim() !== '') {
            contenedor.innerHTML = '<p>🔍 No se encontraron herramientas con el código "<strong>' + escapeHtml(codigoBusqueda) + '</strong>"</p>';
          } else {
            contenedor.innerHTML = '<p>No hay herramientas registradas. Verifica que el backend esté corriendo en ' + BACKEND + '</p>';
          }
          return;
        }
        
        console.log('📊 Mostrando', mostrados.length, 'herramientas');
        mostrados.forEach(t => contenedor.appendChild(renderCard(t)));
      }

          '<div><label style="display:block;margin-bottom:8px;font-weight:600;color:var(--text);font-size:13px;">Estado</label><select class="up_estado" style="width:100%;padding:10px;border:1px solid var(--card-border);border-radius:6px;font-size:14px;background:var(--surface);color:var(--text);"><option value="">Seleccionar</option><option value="Disponible">Disponible</option><option value="Mantenimiento">Mantenimiento</option><option value="No_disponible">No disponible</option></select></div>' +
          '<div><label style="display:block;margin-bottom:8px;font-weight:600;color:var(--text);font-size:13px;">Disponible</label><select class="up_disponible" style="width:100%;padding:10px;border:1px solid var(--card-border);border-radius:6px;font-size:14px;background:var(--surface);color:var(--text);"><option value="true">Sí</option><option value="false">No</option></select></div>' +
          '<div><label style="display:block;margin-bottom:8px;font-weight:600;color:var(--text);font-size:13px;">Fecha ingreso</label><input class="up_fecha" type="date" style="width:100%;padding:10px;border:1px solid var(--card-border);border-radius:6px;font-size:14px;background:var(--surface);color:var(--text);" /></div>' +
          '</div>' +
          '<div style="margin-bottom:20px;"><label style="display:block;margin-bottom:8px;font-weight:600;color:var(--text);font-size:13px;">Comentario</label><textarea class="up_comentario" style="width:100%;padding:12px;border:1px solid var(--card-border);border-radius:6px;min-height:100px;resize:vertical;font-size:14px;background:var(--surface);color:var(--text);font-family:inherit;"></textarea></div>' +
          '<div style="display:flex;gap:12px;justify-content:flex-end;"><button class="up_save btn-small" type="button" style="background:#4CAF50;color:#fff;padding:10px 24px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;">Guardar</button><button class="up_cancel btn-small delete" type="button" style="background:#f44336;color:#fff;padding:10px 24px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;">Cancelar</button></div>';

        try { panel.querySelector('.up_estado').value = detalle.estado || ''; } catch(e){}
        try { panel.querySelector('.up_disponible').value = detalle.disponible ? 'true' : 'false'; } catch(e){}
        try { panel.querySelector('.up_fecha').value = detalle.fechaIngreso || ''; } catch(e){}
        try { panel.querySelector('.up_comentario').value = detalle.comentario || ''; } catch(e){}

        panel.querySelector('.up_cancel').addEventListener('click', function(){ panel.remove(); });

        panel.querySelector('.up_save').addEventListener('click', async function(){
          const payload = {
            estado: panel.querySelector('.up_estado').value || detalle.estado,
            disponible: panel.querySelector('.up_disponible').value === 'true',
            fechaIngreso: panel.querySelector('.up_fecha').value || detalle.fechaIngreso,
            comentario: panel.querySelector('.up_comentario').value || ''
          };

          const idD = detalle.idDetalle || detalle.id_detalle || detalle.id;

          try {
            if (API && typeof API.actualizarDetalle === 'function') {
              await API.actualizarDetalle(idD, payload, herramientaId);
            } else {
              const response = await fetch(BACKEND + '/api/herramienta-detalle/' + encodeURIComponent(idD), {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(payload)
              });
              if (!response.ok) {
                const errorData = await response.text();
                let errorMessage = 'Error al actualizar detalle';
                try {
                  const errorJson = JSON.parse(errorData);
                  errorMessage = errorJson.message || errorJson.error || errorData;
                } catch(e) {
                  errorMessage = errorData || `Error HTTP ${response.status}`;
                }
                throw new Error(errorMessage);
              }
            }
            alert('Unidad actualizada');
            panel.remove();
            openDetallesModal(herramientaId);
          } catch (e) {
            console.error('Error al actualizar detalle:', e);
            alert('Error: ' + (e.message || e));
          }
        });

        return panel;
      }

      function closeModal() {
        modalBackdrop.classList.remove('open');
        modalBackdrop.setAttribute('aria-hidden','true');
        modalContent.innerHTML = '';
      }

      if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
      modalBackdrop.addEventListener('click', function(ev) { if (ev.target === modalBackdrop) closeModal(); });
      document.addEventListener('keydown', function(ev) { if (ev.key === 'Escape') closeModal(); });

      let eliminandoEnProceso = false;

contenedor.addEventListener('click', function(ev){
  const btn = ev.target.closest('button');
  if (!btn) return;
  const id = btn.dataset.id;
  const nombre = btn.dataset.nombre;

  if (btn.classList.contains('detalles')) {
    openDetallesModal(id, nombre);
  } else if (btn.classList.contains('editar')) {
    openEditLoteModal(id, nombre);
  } else if (btn.classList.contains('eliminar')) {
    eliminarHerramienta(id, nombre);
  }
});

async function eliminarHerramienta(id, nombre) {
  const thisBtn = document.querySelector(`button.eliminar[data-id="${id}"]`);
  if (!id) return;
  if (thisBtn) thisBtn.disabled = true;

  try {
    const confirmed = await showConfirmModal(
      '¿Está seguro de que desea eliminar esta herramienta completa?',
      `${nombre} (ID: ${id})\n\nEsto eliminará la herramienta y todas sus unidades.`
    );

    if (!confirmed) return;

    const response = await fetch(BACKEND + '/herramienta/' + encodeURIComponent(id), {
      method: 'DELETE'
    });

    if (!response.ok && response.status !== 204) {
      const errorData = await response.text();
      // OPCIONAL: Personalizar mensaje por Foreign Key
      if (errorData.includes('foreign key constraint')) {
        alert('❌ No puedes eliminar esta herramienta porque tiene préstamos asociados. Devuelve o elimina los préstamos primero.');
      } else {
        alert('❌ Error al eliminar la herramienta:\n\n' + (errorData || 'Error desconocido'));
      }
      return;
    }

    alert('✅ Herramienta eliminada exitosamente');
    await mostrarInventario(buscarCodigoInput.value);

  } catch (e) {
    alert('❌ Error inesperado:\n\n' + (e.message || e));
  } finally {
    if (thisBtn) thisBtn.disabled = false;
  }
}

      // Búsqueda con debounce para mejor rendimiento
      let timeoutBusqueda = null;
      buscarCodigoInput.addEventListener('input', function() {
        clearTimeout(timeoutBusqueda);
        const codigo = this.value.trim();
        timeoutBusqueda = setTimeout(() => {
          if (!codigo) {
            contenedor.innerHTML = '<p style="color:#b00020;">Debes ingresar un código único.</p>';
            return;
          }
          fetch(HERR_URL + '/buscar?codigoUnico=' + encodeURIComponent(codigo), {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          })
          .then(function(res) {
            if (!res.ok) return res.text().then(function(msg) { throw new Error(msg); });
            return res.json();
          })
          .then(function(herramientas) {
            if (!herramientas || herramientas.length === 0) {
              contenedor.innerHTML = '<p>No se encontraron herramientas para ese código único.</p>';
              return;
            }
            contenedor.innerHTML = '';
            var grid = document.createElement('div');
            grid.className = 'tarjetas-container';
            herramientas.forEach(function(h) {
              grid.appendChild(renderCard(h));
            });
            contenedor.appendChild(grid);
          })
          .catch(function(err) {
            contenedor.innerHTML = '<p style="color:#b00020;">Error: ' + (err.message || err) + '</p>';
          });
        }, 300); // Esperar 300ms después de que el usuario deje de escribir
      });

      // Limpiar búsqueda al presionar Escape
      buscarCodigoInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          this.value = '';
          mostrarInventario('');
        }
      });

      // debug: mostrar backend base en consola
      console.log('[CONFIG] BACKEND =', BACKEND);

      // inicializar
      mostrarInventario();
    })();
  </script>
