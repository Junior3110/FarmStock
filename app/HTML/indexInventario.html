<head>

  <!-- Prevenir flashazo del modo oscuro -->
  <script>
    (function() {
      const saved = localStorage.getItem('fs_dark_mode');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldBeDark = saved === null ? prefersDark : saved === 'true';
      if (shouldBeDark) {
        document.documentElement.classList.add('dark-mode');
        document.body.classList.add('dark-mode');
      }
    })();
  </script>

  <!-- Usa tu CSS global -->
  <link rel="stylesheet" href="../CSS/index.css" />

  <style>
    /* (estilos específicos para inventario) */
    .tarjetas-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      padding: 12px;
      box-sizing: border-box;
      align-content: start;
      max-height: calc(100vh - 240px);
      overflow: auto;
      border-radius: 10px;
      background: transparent;
    }

    .tarjetas-container .tarjeta {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 98%, transparent 2%), transparent);
      box-shadow: 0 6px 18px rgba(16,34,31,0.03);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 92px;
    }

    .tarjetas-container .tarjeta h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.1;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .tarjetas-container .tarjeta p { margin:0; font-size:12px; color:var(--muted); }

    .tarjetas-container .tarjeta .acciones { margin-top:6px; display:flex; gap:8px; justify-content:flex-end; }

    .card-qr { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .card-qr img { width:72px; height:72px; object-fit:contain; border-radius:6px; border:1px solid #ddd; background:#fff; }

    .modal-qr { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
    .modal-qr img { max-width:140px; max-height:140px; border-radius:6px; border:1px solid #eee; background:#fff; }

    @media (max-width:560px) {
      .tarjetas-container { grid-template-columns: 1fr; max-height: calc(100vh - 220px); }
      .tarjetas-container .tarjeta { min-height:110px; }
    }

    /* Modal de confirmación personalizado */
    .confirm-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 15000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .confirm-modal-backdrop.show {
      display: flex;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .confirm-modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 0;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transform: scale(0.9) translateY(-20px);
      animation: modalBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      overflow: hidden;
    }

    @keyframes modalBounce {
      to {
        transform: scale(1) translateY(0);
      }
    }

    .confirm-modal-header {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .confirm-modal-icon {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-5deg); }
      75% { transform: translateX(10px) rotate(5deg); }
    }

    .confirm-modal-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

        #closeModalInv{
      background-color: #ee5a6f;
    }

    .confirm-modal-body {
      padding: 24px;
      color: var(--text);
    }

    .confirm-modal-message {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .confirm-modal-detail {
      background: var(--card-bg);
      border-left: 3px solid #ff6b6b;
      padding: 12px 16px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      color: var(--text);
    }

    .confirm-modal-footer {
      padding: 16px 24px 24px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .confirm-modal-btn {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .confirm-modal-btn-cancel {
      background: var(--card-bg);
      color: var(--text);
    }

    .confirm-modal-btn-cancel:hover {
      background: var(--hover-bg);
      transform: translateY(-1px);
    }

    .confirm-modal-btn-confirm {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
    }

    .confirm-modal-btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
    }

    .confirm-modal-btn:active {
      transform: translateY(0);
    }


  </style>
</head>

  <script src="../FSApiClient.js"></script>

  <script>
    (function () {
      const API = window.FSApiClient;
      const contenedor = document.getElementById('inventarioLista');
      const buscarCodigoInput = document.getElementById('buscarCodigo');
      const modalBackdrop = document.getElementById('modalBackdropInv');
      const modalContent = document.getElementById('modalContentInv');
      const modalTitle = document.getElementById('modalTitleInv');
      const closeModalBtn = document.getElementById('closeModalInv');

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function parseIsoToDate(str) {
        if (!str) return null;
        const d = new Date(str);
        if (isNaN(d)) return null;
        return d;
      }
      function normalizeTool(h) {
        const idVal = h.idHerramienta || h.id || h.id_herramienta || h.idHerr || null;
        return {
          idHerramienta: idVal,
          id: idVal,
          nombre: h.nombre || h.name || '',
          estado: h.estado || '',
          tipo: h.tipo || '',
          ubicacion: h.ubicacion || '',
          fecha: h.fecha_registro || h.fechaRegistro || h.fecha || '',
          lote: h.numero_lote || h.numeroLote || h.lote || '',
          cantidad: (h.cantidad != null) ? h.cantidad : (h.cantidad || 0),
          descripcion: h.descripcion || h.desc || '',
          detalles: h.detalles || []
        };
      }

      // ===== CONFIG: BACKEND en local =====
      const BACKEND_BASE = 'http://127.0.0.1:8080'; // <-- backend local
      function ensureNoSlash(u){ return u && u.endsWith('/') ? u.slice(0,-1) : u; }
      const BACKEND = ensureNoSlash(BACKEND_BASE);

      // ===== MODAL DE CONFIRMACIÓN PERSONALIZADO =====
      function showConfirmModal(message, detail) {
        return new Promise((resolve) => {
          const backdrop = document.getElementById('confirmModalBackdrop');
          const messageEl = document.getElementById('confirmModalMessage');
          const detailEl = document.getElementById('confirmModalDetail');
          const confirmBtn = document.getElementById('confirmModalConfirm');
          const cancelBtn = document.getElementById('confirmModalCancel');

          messageEl.textContent = message;
          detailEl.textContent = detail;

          backdrop.classList.add('show');

          const handleConfirm = () => {
            backdrop.classList.remove('show');
            setTimeout(() => backdrop.style.display = 'none', 300);
            cleanup();
            resolve(true);
          };

          const handleCancel = () => {
            backdrop.classList.remove('show');
            setTimeout(() => backdrop.style.display = 'none', 300);
            cleanup();
            resolve(false);
          };

          const handleEscape = (e) => {
            if (e.key === 'Escape') handleCancel();
          };

          const cleanup = () => {
            confirmBtn.removeEventListener('click', handleConfirm);
            cancelBtn.removeEventListener('click', handleCancel);
            backdrop.removeEventListener('click', handleBackdropClick);
            document.removeEventListener('keydown', handleEscape);
          };

          const handleBackdropClick = (e) => {
            if (e.target === backdrop) handleCancel();
          };

          confirmBtn.addEventListener('click', handleConfirm);
          cancelBtn.addEventListener('click', handleCancel);
          backdrop.addEventListener('click', handleBackdropClick);
          document.addEventListener('keydown', handleEscape);
        });
      }

      // Construye URL absoluta para QR por CÓDIGO UNICO (archivo en backend: qr_<CODIGO>.png)
      function qrUrlForCodigo(codigoUnico) {
        if (!codigoUnico) return '';
        const file = encodeURIComponent('qr_' + codigoUnico) + '.png';
        return BACKEND + '/qr/' + file;
      }

      // Construye URL absoluta para QR por NOMBRE de herramienta (si es que guardaste por nombre)
      function qrUrlForToolName(toolName) {
        if (!toolName) return '';
        const file = encodeURIComponent(toolName) + '.png';
        return BACKEND + '/qr/' + file;
      }

      // Helper: crear imagen pequeña (para tarjeta)
      function createSmallQrImg(codigoUnico) {
        const img = document.createElement('img');
        const src = qrUrlForCodigo(codigoUnico);
        img.src = src;
        img.alt = 'QR ' + (codigoUnico || '');
        img.onerror = function() { console.warn('[QR] not found:', src); this.style.display = 'none'; };
        img.onload = function() { /* ok */ };
        console.log('[QR] small img src ->', src);
        return img;
      }

      // Helper: crear bloque QR para modal
      function createQrElement(qrImgUrl, titleText, idText) {
        const qrDiv = document.createElement('div');
        qrDiv.className = 'modal-qr';

        const imgWrap = document.createElement('div');
        const img = document.createElement('img');
        img.src = qrImgUrl || '';
        img.alt = 'QR';
        img.onerror = function() { console.warn('[QR] modal not found:', qrImgUrl); this.style.display = 'none'; };
        imgWrap.appendChild(img);
        qrDiv.appendChild(imgWrap);

        const infoDiv = document.createElement('div');
        infoDiv.innerHTML = '<strong>' + escapeHtml(titleText || '') + '</strong><br/><small>ID: ' + escapeHtml(String(idText || '')) + '</small>';
        qrDiv.appendChild(infoDiv);

        console.log('[QR] modal img src ->', qrImgUrl);
        return qrDiv;
      }

      // Obtener detalles de herramientas desde el backend
      async function fetchAllToolsWithDetails() {
        try {
          const response = await fetch(BACKEND + '/api/herramienta-detalle');
          if (response.ok) {
            const detalles = await response.json();
            console.log('📦 Detalles cargados:', detalles);
            return Array.isArray(detalles) ? detalles : [];
          }
          console.warn('No se pudieron cargar detalles del backend');
          return [];
        } catch (e) {
          console.warn('Error al cargar detalles:', e);
          return [];
        }
      }

      async function fetchAllTools() {
        if (API && typeof API.obtenerTodasHerramientas === 'function') {
          try {
            const remoto = await API.obtenerTodasHerramientas();
            return (Array.isArray(remoto) ? remoto.map(normalizeTool) : []);
          } catch (e) {
            console.warn('Error backend API, fallback to local', e);
            return loadToolsFromLocal();
          }
        } else {
          try {
            const r = await fetch(BACKEND + '/herramienta'); // intenta backend directo
            if (r.ok) {
              const arr = await r.json();
              return (Array.isArray(arr) ? arr.map(normalizeTool) : []);
            }
            return loadToolsFromLocal();
          } catch (e) {
            console.warn('Fetch failed', e);
            return loadToolsFromLocal();
          }
        }
      }

      function loadToolsFromLocal() {
        try {
          const raw = localStorage.getItem('fs_local_tools_v1');
          if (raw) return JSON.parse(raw).map(normalizeTool);
        } catch (e) {}
        try {
          const raw = localStorage.getItem('herramientas');
          if (raw) return JSON.parse(raw).map(normalizeTool);
        } catch (e) {}
        return [];
      }

      function renderCard(h) {
        const fechaDisplay = h.fecha ? (parseIsoToDate(h.fecha) ? parseIsoToDate(h.fecha).toLocaleDateString() : h.fecha) : '-';
        const div = document.createElement('div');
        div.className = 'tarjeta herramienta-card';
        div.innerHTML = `
          <h3>${escapeHtml(h.nombre)}</h3>
          <p><strong>Estado:</strong> ${escapeHtml(h.estado)}</p>
          <p><strong>Tipo:</strong> ${escapeHtml(h.tipo)}</p>
          <p><strong>Ubicación:</strong> ${escapeHtml(h.ubicacion)}</p>
          <p><strong>Fecha ingreso:</strong> ${escapeHtml(fechaDisplay)}</p>
          <p><strong>Lote:</strong> ${escapeHtml(h.lote)}</p>
          <p><strong>Cantidad:</strong> ${escapeHtml(String(h.cantidad))}</p>
          <div class="acciones">
            <button class="btn-small detalles" data-id="${escapeHtml(h.idHerramienta || h.id)}" data-nombre="${escapeHtml(h.nombre)}">Ver detalles</button>
            <button class="btn-small editar" data-id="${escapeHtml(h.idHerramienta || h.id)}" data-nombre="${escapeHtml(h.nombre)}">Editar</button>
            <button class="btn-small delete eliminar" data-id="${escapeHtml(h.idHerramienta || h.id)}">Eliminar</button>
          </div>
        `;

        // mostrar QR pequeño (si hay detalles, tomar el primer detalle)
        if (Array.isArray(h.detalles) && h.detalles.length > 0) {
          const primerDetalle = h.detalles[0];
          const codigo = primerDetalle.codigoUnico || primerDetalle.codigo || primerDetalle.idDetalle || null;
          if (codigo) {
            const qrContainer = document.createElement('div');
            qrContainer.className = 'card-qr';
            const smallImg = createSmallQrImg(codigo);
            const txt = document.createElement('div');
            txt.innerHTML = '<small>' + escapeHtml(codigo) + '</small>';
            qrContainer.appendChild(smallImg);
            qrContainer.appendChild(txt);
            div.insertBefore(qrContainer, div.firstChild);
          }
        }

        return div;
      }

      function applyCodeFilter(items, codigoBusqueda, todosDetalles) {
        if (!codigoBusqueda || codigoBusqueda.trim() === '') return items;
        
        const termino = codigoBusqueda.trim().toLowerCase();
        console.log('🔍 Buscando por código:', termino);
        
        // Filtrar detalles que coincidan con el código buscado
        const detallesFiltrados = todosDetalles.filter(detalle => {
          const codigo = (detalle.codigoUnico || '').toLowerCase();
          return codigo.includes(termino);
        });
        
        console.log('📋 Detalles encontrados:', detallesFiltrados);
        
        // Obtener IDs de herramientas que tienen esos códigos
        const idsHerramientas = [...new Set(detallesFiltrados.map(d => 
          d.herramienta?.idHerramienta || d.herramienta?.id
        ))].filter(Boolean);
        
        console.log('🔑 IDs de herramientas:', idsHerramientas);
        
        // Filtrar herramientas que coincidan
        return items.filter(h => 
          idsHerramientas.includes(h.idHerramienta || h.id)
        );
      }

      async function mostrarInventario(codigoBusqueda = '') {
        contenedor.innerHTML = '<p>Cargando inventario...</p>';
        let all = [];
        try { all = await fetchAllTools(); } catch (e) { all = loadToolsFromLocal(); }
        
        let mostrados = all;
        
        // Aplicar filtro de búsqueda por código único
        if (codigoBusqueda && codigoBusqueda.trim() !== '') {
          const todosDetalles = await fetchAllToolsWithDetails();
          mostrados = applyCodeFilter(all, codigoBusqueda, todosDetalles);
        }
        
        contenedor.innerHTML = '';
        if (!mostrados || mostrados.length === 0) {
          if (codigoBusqueda && codigoBusqueda.trim() !== '') {
            contenedor.innerHTML = '<p>🔍 No se encontraron herramientas con el código "<strong>' + escapeHtml(codigoBusqueda) + '</strong>"</p>';
          } else {
            contenedor.innerHTML = '<p>No hay herramientas registradas.</p>';
          }
          return;
        }
        
        mostrados.forEach(t => contenedor.appendChild(renderCard(t)));
      }

      // Edit modal (simplificado) y detalles modal que muestran QR grande por unidad
      function openEditLoteModal(id, nombre) {
        if (!id) return;
        modalTitle.textContent = 'Editar registro';
        modalContent.innerHTML = '<p>Cargando...</p>';
        modalBackdrop.classList.add('open');
        modalBackdrop.setAttribute('aria-hidden','false');

        (async function(){
          let found = null;
          try {
            if (API && typeof API.obtenerTodasHerramientas === 'function') {
              const all = await API.obtenerTodasHerramientas();
              found = (Array.isArray(all) ? all.map(normalizeTool).find(x => String(x.idHerramienta) === String(id) || String(x.id) === String(id)) : null);
            }
            if (!found) {
              const local = loadToolsFromLocal();
              found = local.find(x => String(x.idHerramienta) === String(id) || String(x.id) === String(id));
            }
          } catch (e) {
            console.warn('Error loading for edit', e);
            const local = loadToolsFromLocal();
            found = local.find(x => String(x.idHerramienta) === String(id) || String(x.id) === String(id));
          }

          if (!found) {
            modalContent.innerHTML = '<p>No se encontró el registro.</p>';
            return;
          }

          buildEditModalFromFound(found, String(found.id).startsWith('local-') || !!found._local);
        })();

        function buildEditModalFromFound(found, isLocal) {
          modalContent.innerHTML = '';
          const container = document.createElement('div');

          const qrImgUrl = qrUrlForToolName(found.nombre);
          const qrElement = createQrElement(qrImgUrl, found.nombre || '', (found.idHerramienta || found.id));

          const html = '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            '<div style="flex:1;min-width:240px;"><label>Nombre</label><input id="edit_nombre" type="text" value="' + escapeHtml(found.nombre || '') + '" /></div>' +
            '<div style="flex:1;min-width:180px;"><label>Estado</label><select id="edit_estado"><option value="">Seleccionar</option><option value="Disponible">Disponible</option><option value="Mantenimiento">Mantenimiento</option><option value="No_disponible">No disponible</option></select></div>' +
            '<div style="flex:1;min-width:180px;"><label>Tipo</label><select id="edit_tipo"><option value="">Seleccionar</option><option value="Manual">Manual</option><option value="Electrica">Eléctrica</option></select></div>' +
            '</div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">' +
            '<div style="flex:1;min-width:180px;"><label>Ubicación</label><select id="edit_ubicacion"><option value="">Seleccionar</option><option value="Bodega">Bodega</option><option value="Taller">Taller</option></select></div>' +
            '<div style="flex:1;min-width:180px;"><label>Fecha registro</label><input id="edit_fecha" type="date" value="' + escapeHtml(String(found.fecha || '')) + '" /></div>' +
            '<div style="flex:1;min-width:180px;"><label>Número lote</label><select id="edit_lote"><option value="">Seleccionar</option><option value="Lote 1">Lote 1</option><option value="Lote 2">Lote 2</option></select></div>' +
            '</div>' +
            '<div style="margin-top:10px;"><label>Cantidad</label><input id="edit_cantidad" type="number" min="0" value="' + escapeHtml(String(found.cantidad || 0)) + '" /></div>' +
            '<div style="margin-top:10px;"><label>Descripción</label><textarea id="edit_descripcion" style="width:100%;">' + escapeHtml(found.descripcion || '') + '</textarea></div>' +
            '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;"><button id="saveEditInv" class="btn-small" type="button">Guardar</button><button id="cancelEditInv" class="btn-small delete" type="button">Cancelar</button></div>';
          container.innerHTML = html;

          container.insertBefore(qrElement, container.firstChild);
          modalContent.appendChild(container);

          try { document.getElementById('edit_estado').value = found.estado || ''; } catch(e){}
          try { document.getElementById('edit_tipo').value = found.tipo || ''; } catch(e){}
          try { document.getElementById('edit_ubicacion').value = found.ubicacion || ''; } catch(e){}
          try { document.getElementById('edit_lote').value = found.lote || found.numero_lote || ''; } catch(e){}

          document.getElementById('cancelEditInv').addEventListener('click', () => closeModal());

          document.getElementById('saveEditInv').addEventListener('click', async function(){
            const payload = {
              nombre: (document.getElementById('edit_nombre').value || '').trim(),
              estado: (document.getElementById('edit_estado').value || '').trim(),
              tipo: (document.getElementById('edit_tipo').value || '').trim(),
              ubicacion: (document.getElementById('edit_ubicacion').value || '').trim(),
              fecha_registro: (document.getElementById('edit_fecha').value || ''),
              numero_lote: (document.getElementById('edit_lote').value || ''),
              cantidad: parseInt(document.getElementById('edit_cantidad').value || '0',10) || 0,
              descripcion: (document.getElementById('edit_descripcion').value || '').trim()
            };
            if (!payload.nombre || !payload.estado) {
              alert('Completa al menos nombre y estado.');
              return;
            }

            try {
              if (API && typeof API.actualizarHerramienta === 'function') {
                await API.actualizarHerramienta(found.idHerramienta || found.id, payload);
              } else {
                const response = await fetch(BACKEND + '/herramienta/' + encodeURIComponent(found.idHerramienta || found.id), {
                  method: 'PUT',
                  headers: {'Content-Type':'application/json'},
                  body: JSON.stringify(payload)
                });
                if (!response.ok) {
                  const errorData = await response.text();
                  let errorMessage = 'Error al actualizar';
                  try {
                    const errorJson = JSON.parse(errorData);
                    errorMessage = errorJson.message || errorJson.error || errorData;
                  } catch(e) {
                    errorMessage = errorData || `Error HTTP ${response.status}`;
                  }
                  throw new Error(errorMessage);
                }
              }
              alert('Registro actualizado en servidor.');
              closeModal();
              mostrarInventario(buscarCodigoInput.value);
            } catch (e) {
              console.error('Error al actualizar:', e);
              alert('Error: ' + (e.message || e));
            }
          });
        }
      }

      async function openDetallesModal(herramientaId, nombre) {
        if (!herramientaId) return;
        modalTitle.textContent = 'Detalles: ' + (nombre || '');
        modalContent.innerHTML = '<p>Cargando detalles...</p>';
        modalBackdrop.classList.add('open');
        modalBackdrop.setAttribute('aria-hidden','false');

        const qrImgUrl = qrUrlForToolName(nombre);

        try {
          let detalles = [];
          if (API && typeof API.obtenerDetalles === 'function') {
            detalles = await API.obtenerDetalles(herramientaId);
          } else {
            const local = loadToolsFromLocal();
            const t = local.find(x => String(x.idHerramienta) === String(herramientaId) || String(x.id) === String(herramientaId));
            detalles = (t && t.detalles) ? t.detalles : [];
          }
          renderDetallesList(detalles || [], herramientaId, nombre, qrImgUrl);
        } catch (err) {
          console.warn('DETALLE failed', err);
          const local = loadToolsFromLocal();
          const t = local.find(x => String(x.idHerramienta) === String(herramientaId) || String(x.id) === String(herramientaId));
          if (t) renderDetallesList(t.detalles || [], herramientaId, nombre, qrImgUrl);
          else {
            modalBackdrop.classList.remove('open');
            modalBackdrop.setAttribute('aria-hidden','true');
            alert('No se pudieron cargar los detalles.');
          }
        }

        function renderDetallesList(detalles, herramientaId, nombre, qrImgUrl) {
          modalContent.innerHTML = '';
          const qrElement = createQrElement(qrImgUrl, nombre || '', herramientaId);
          modalContent.appendChild(qrElement);

          if (!Array.isArray(detalles) || detalles.length === 0) {
            modalContent.innerHTML += '<p>No hay detalles.</p>';
            return;
          }
          const listDiv = document.createElement('div');
          listDiv.className = 'modal-list';
          detalles.forEach(function(d, idx){
            const cont = document.createElement('div');
            cont.className = 'tarjeta';
            cont.style.display = 'flex';
            cont.style.justifyContent = 'space-between';
            cont.style.alignItems = 'flex-start';
            cont.style.gap = '12px';

            const left = document.createElement('div');
            left.style.flex = '1';
            const nombreUnit = (d.herramienta && d.herramienta.nombre) ? d.herramienta.nombre : ('Unidad ' + (idx + 1));
            const h4 = document.createElement('h4');
            h4.textContent = nombreUnit + ' — ' + (d.codigoUnico || '');
            const p1 = document.createElement('p');
            p1.innerHTML = '<strong>Estado:</strong> ' + escapeHtml(d.estado || '-');
            const p2 = document.createElement('p');
            p2.innerHTML = '<strong>Disponible:</strong> ' + (d.disponible ? 'Sí' : 'No') + ' • <strong>Fecha ingreso:</strong> ' + (d.fechaIngreso || '-');
            left.appendChild(h4); left.appendChild(p1); left.appendChild(p2);

            const right = document.createElement('div');
            right.style.display = 'flex';
            right.style.flexDirection = 'column';
            right.style.gap = '8px';
            right.style.alignItems = 'flex-end';

            // mostrar QR por código único del detalle (patrón: qr_<CODIGO>.png)
            const codigo = d.codigoUnico || d.codigo || d.idDetalle || d.id;
            const img = document.createElement('img');
            img.src = codigo ? qrUrlForCodigo(codigo) : '';
            img.alt = 'QR ' + (codigo || '');
            img.style.width = '120px';
            img.style.height = '120px';
            img.style.objectFit = 'contain';
            img.style.borderRadius = '6px';
            img.style.border = '1px solid #eee';
            img.onerror = function() { console.warn('[QR] detalle not found:', img.src); this.style.display = 'none'; };

            const btnEdit = document.createElement('button');
            btnEdit.type = 'button';
            btnEdit.className = 'btn-small';
            btnEdit.textContent = 'Editar unidad';
            btnEdit.addEventListener('click', function(){
              const panel = cont.querySelector('.edit-panel');
              if (!panel) {
                const p = buildDetalleEditPanel(d, herramientaId);
                cont.appendChild(p);
                p.style.display = 'block';
              } else panel.style.display = (panel.style.display === 'none' ? 'block' : 'none');
            });

            const btnDelete = document.createElement('button');
            btnDelete.type = 'button';
            btnDelete.className = 'btn-small delete';
            btnDelete.textContent = 'Eliminar unidad';
            btnDelete.addEventListener('click', async function(){
              const idD = d.idDetalle || d.id_detalle || d.id;
              const nombreUnidad = (d.herramienta && d.herramienta.nombre) ? d.herramienta.nombre : 'esta unidad';
              const codigoUnidad = d.codigoUnico || idD;
              
              // Mostrar modal de confirmación personalizado
              const confirmed = await showConfirmModal(
                '¿Está seguro de que desea eliminar esta unidad?',
                `${nombreUnidad} (${codigoUnidad})`
              );

              if (!confirmed) return;

              try {
                if (API && typeof API.eliminarDetalle === 'function') {
                  await API.eliminarDetalle(idD);
                } else {
                  const response = await fetch(BACKEND + '/api/herramienta-detalle/' + encodeURIComponent(idD), {
                    method: 'DELETE'
                  });
                  if (!response.ok) {
                    const errorData = await response.text();
                    let errorMessage = 'Error al eliminar';
                    try {
                      const errorJson = JSON.parse(errorData);
                      errorMessage = errorJson.message || errorJson.error || errorData;
                    } catch(e) {
                      errorMessage = errorData || `Error HTTP ${response.status}`;
                    }
                    throw new Error(errorMessage);
                  }
                }
                alert('Unidad eliminada exitosamente');
                // Recargar detalles usando el nombre de la herramienta del detalle
                openDetallesModal(herramientaId, nombreUnidad);
              } catch (e) {
                console.error('Error al eliminar detalle:', e);
                alert('Error: ' + (e.message || e));
              }
            });

            right.appendChild(img);
            right.appendChild(btnEdit);
            right.appendChild(btnDelete);

            cont.appendChild(left);
            cont.appendChild(right);

            listDiv.appendChild(cont);
          });
          modalContent.appendChild(listDiv);
        }
      }

      function buildDetalleEditPanel(detalle, herramientaId) {
        const panel = document.createElement('div');
        panel.className = 'edit-panel';
        panel.style.display = 'block';
        panel.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<div style="min-width:160px;"><label>Estado</label><select class="up_estado"><option value="">Seleccionar</option><option value="Disponible">Disponible</option><option value="Mantenimiento">Mantenimiento</option><option value="No_disponible">No disponible</option></select></div>' +
          '<div style="min-width:160px;"><label>Disponible</label><select class="up_disponible"><option value="true">Sí</option><option value="false">No</option></select></div>' +
          '<div style="min-width:160px;"><label>Fecha ingreso</label><input class="up_fecha" type="date" /></div>' +
          '</div><div style="margin-top:8px;"><label>Comentario</label><textarea class="up_comentario" style="width:100%;"></textarea></div>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;"><button class="up_save btn-small" type="button">Guardar</button><button class="up_cancel btn-small delete" type="button">Cancelar</button></div>';

        try { panel.querySelector('.up_estado').value = detalle.estado || ''; } catch(e){}
        try { panel.querySelector('.up_disponible').value = detalle.disponible ? 'true' : 'false'; } catch(e){}
        try { panel.querySelector('.up_fecha').value = detalle.fechaIngreso || ''; } catch(e){}
        try { panel.querySelector('.up_comentario').value = detalle.comentario || ''; } catch(e){}

        panel.querySelector('.up_cancel').addEventListener('click', function(){ panel.style.display='none'; });

        panel.querySelector('.up_save').addEventListener('click', async function(){
          const payload = {
            estado: panel.querySelector('.up_estado').value || detalle.estado,
            disponible: panel.querySelector('.up_disponible').value === 'true',
            fechaIngreso: panel.querySelector('.up_fecha').value || detalle.fechaIngreso,
            comentario: panel.querySelector('.up_comentario').value || ''
          };

          const idD = detalle.idDetalle || detalle.id_detalle || detalle.id;

          try {
            if (API && typeof API.actualizarDetalle === 'function') {
              await API.actualizarDetalle(idD, payload, herramientaId);
            } else {
              const response = await fetch(BACKEND + '/api/herramienta-detalle/' + encodeURIComponent(idD), {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(payload)
              });
              if (!response.ok) {
                const errorData = await response.text();
                let errorMessage = 'Error al actualizar detalle';
                try {
                  const errorJson = JSON.parse(errorData);
                  errorMessage = errorJson.message || errorJson.error || errorData;
                } catch(e) {
                  errorMessage = errorData || `Error HTTP ${response.status}`;
                }
                throw new Error(errorMessage);
              }
            }
            alert('Unidad actualizada');
            openDetallesModal(herramientaId);
          } catch (e) {
            console.error('Error al actualizar detalle:', e);
            alert('Error: ' + (e.message || e));
          }
        });

        return panel;
      }

      function closeModal() {
        modalBackdrop.classList.remove('open');
        modalBackdrop.setAttribute('aria-hidden','true');
        modalContent.innerHTML = '';
      }

      if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
      modalBackdrop.addEventListener('click', function(ev) { if (ev.target === modalBackdrop) closeModal(); });
      document.addEventListener('keydown', function(ev) { if (ev.key === 'Escape') closeModal(); });

      contenedor.addEventListener('click', function(ev){
        const btn = ev.target.closest('button');
        if (!btn) return;
        const id = btn.dataset.id;
        const nombre = btn.dataset.nombre;
        if (btn.classList.contains('detalles')) {
          openDetallesModal(id, nombre);
        } else if (btn.classList.contains('editar')) {
          openEditLoteModal(id, nombre);
        } else if (btn.classList.contains('eliminar')) {
          if (!confirm('Eliminar herramienta id ' + id + '?')) return;
          (async function(){
            try {
              if (API && typeof API.eliminarHerramienta === 'function') await API.eliminarHerramienta(id);
              else await fetch(BACKEND + '/herramienta/' + encodeURIComponent(id), { method: 'DELETE' });
              mostrarInventario(buscarCodigoInput.value);
            } catch (e) {
              console.error('Eliminar error', e);
              alert('No se pudo eliminar. Revisa la consola.');
            }
          })();
        }
      });

      // Búsqueda con debounce para mejor rendimiento
      let timeoutBusqueda = null;
      buscarCodigoInput.addEventListener('input', function() {
        clearTimeout(timeoutBusqueda);
        timeoutBusqueda = setTimeout(() => {
          console.log('🔎 Input de búsqueda:', this.value);
          mostrarInventario(this.value);
        }, 300); // Esperar 300ms después de que el usuario deje de escribir
      });

      // Limpiar búsqueda al presionar Escape
      buscarCodigoInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          this.value = '';
          mostrarInventario('');
        }
      });

      // debug: mostrar backend base en consola
      console.log('[CONFIG] BACKEND =', BACKEND);

      // inicializar
      mostrarInventario();
    })();
  </script>

  <script src="../user-session.js"></script>
  <script src="../modo-oscuro.js"></script>
  <script src="../render-window.js"></script>
</body>
