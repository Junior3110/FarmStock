<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perfil - FarmStock</title>
  <!-- Prevenir flashazo del modo oscuro -->
  <script>
    (function() {
      const saved = localStorage.getItem('fs_dark_mode');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldBeDark = saved === null ? prefersDark : saved === 'true';
      if (shouldBeDark) {
        document.documentElement.classList.add('dark-mode');
        document.body.classList.add('dark-mode');
      }
    })();
  </script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var user = null;
        try {
          user = JSON.parse(localStorage.getItem('fs_usuario_actual'));
        } catch(e) {}
        if (user && user.cargo === 'celador') {
          var menuItems = document.querySelectorAll('.menu-modulos li');
          menuItems.forEach(function(item) {
            var link = item.querySelector('a');
            if (
              !link.href.endsWith('equipos-computos.html') &&
              !link.href.endsWith('equipos-movimientos.html')
            ) {
              item.style.display = 'none';
            }
          });
        }
      });
    </script>
  <link rel="stylesheet" href="../CSS/index.css" />
  <link rel="stylesheet" href="../CSS/Notificaciones.css" />
</head>
<body>
  <div class="window-controls">
    <button id="minimize" title="Minimizar" type="button">─</button>
    <button id="maximize" title="Maximizar" type="button">▢</button>
    <button id="close" title="Cerrar" type="button">✕</button>
  </div>

  <div class="container">
    <!-- SIDEBAR: misma estructura que index.html -->
    <aside class="sidebar" style="border-radius: 12px;">
      <div class="top-section">
        <div class="logo"><img src="../imagenes/Logo.png" alt="Logo FarmStock" /></div>
        <ul class="menu-modulos">
          <li><a href="index.html">Registro Herramientas</a></li>
          <li><a href="registro-salida.html">Salida Herramientas</a></li>
          <li><a href="indexInventario.html">Inventario</a></li>
          <!-- <li><a href="Notificaciones.html">Notificaciones</a></li> -->
          <li><a href="estats.html">Estadísticas</a></li>
          <li><a href="registro-aprendices.html">Aprendices</a></li>
          <li><a href="equipos-computos.html">Equipos de Cómputo</a></li>
          <li><a href="equipos-movimientos.html">Movimientos Equipos</a></li>
        </ul>
      </div>

      <div class="sidebar-bottom">
        <a href="quienes-somos.html" class="somos">👥 Quiénes Somos</a>
        <div id="btnModoNoche" class="night-mode">🌙 Modo noche</div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="bienvenida">
        <a href="perfil.html"><img src="../imagenes/usuario.png" alt="Foto de usuario" class="foto-usuario" /></a>
        <p><strong>¡Hola Usuario!</strong></p>
      </div>

      <!-- PERFIL: tarjeta principal con formulario y actividad, usando clases de index.css -->
      <div class="area-superior">
        <div class="formulario-card">
          <div style="display:grid; grid-template-columns: 260px 1fr; gap:18px; align-items:start;">
            <!-- Columna izquierda: avatar + stats -->
            <div>
              <div class="card" style="padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; border-radius: 20px;">
                <img id="avatarImg" src="../imagenes/usuario.png" alt="Avatar" style="width:96px; height:96px; border-radius:12px; object-fit:cover; box-shadow:var(--shadow-1);" />
                <label for="avatarInput" class="custom-file-label" style="display:block;margin-top:10px;">
                  <span style="display:inline-block;padding:10px 18px;background:linear-gradient(90deg,#3b82f6,#10b981);color:#fff;font-weight:700;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px rgba(16,185,129,0.10);transition:background 0.2s;">Cambiar foto de perfil</span>
                  <input type="file" id="avatarInput" accept="image/*" style="display:none;" />
                </label>
                <span id="avatarFileName" style="display:block;margin-top:6px;color:var(--muted);font-size:13px;"></span>
                <div>
                  <h3 style="margin:6px 0 0 0;">María Pérez</h3>
                  <div class="small-muted">Administrador</div>
                </div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                  <button id="editarPerfil" class="btn-small" style="background:#10b981; color:#fff; font-weight:600;">Editar</button>
                  <button id="cerrarSesion" class="btn-small delete" style="background:#ef4444; color:#fff; font-weight:600;">Cerrar sesión</button>
                </div>
              </div>
            </div>

            <!-- Columna derecha: formulario -->
            <div>
              <h3 style="margin-top:0">Información personal</h3>
              <form id="profile-form" class="formulario-horizontal" style="grid-template-columns: 1fr; gap:12px;" novalidate>
                <div class="columna">
                  <label for="nombre">Nombre</label>
                  <input id="nombre" name="nombre" type="text" value="María" placeholder="Nombre" style="border: 1px solid var(--card-border); background: var(--surface); color: var(--text); padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="apellido">Apellido</label>
                  <input id="apellido" name="apellido" type="text" value="Gafaro" placeholder="Apellido" style="border: 1px solid var(--card-border); background: var(--surface); color: var(--text); padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="email">Correo</label>
                  <input id="email" name="email" type="email" value="maria@ejemplo.com" placeholder="correo@dominio.com" style="border: 1px solid var(--card-border); background: var(--surface); color: var(--text); padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="telefono">Teléfono</label>
                  <input id="telefono" name="telefono" type="tel" placeholder="(+57) 300 000 0000" style="border: 1px solid var(--card-border); background: var(--surface); color: var(--text); padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="tipoDocumento">Tipo de documento</label>
                  <input id="tipoDocumento" name="tipoDocumento" type="text" readonly style="background: color-mix(in srgb, var(--surface) 90%, var(--card-border) 10%); border: 1px solid var(--card-border); color: var(--muted); cursor: not-allowed; padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="numeroDocumento">Número de documento</label>
                  <input id="numeroDocumento" name="numeroDocumento" type="text" readonly style="background: color-mix(in srgb, var(--surface) 90%, var(--card-border) 10%); border: 1px solid var(--card-border); color: var(--muted); cursor: not-allowed; padding: 10px; border-radius: 6px;" />
                </div>

                <div style="display:flex; gap:10px; margin-top:8px; justify-content:flex-end;">
                  <button type="submit" class="btn" style="background:#10b981; color:#fff; font-weight:600; border:none;">Guardar cambios</button>
                  <button type="button" id="cambiarPassword" class="btn" style="background:#3b82f6; color:#fff; border:none; font-weight:600;">Cambiar contraseña</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Actividad reciente -->
      <div class="area-inferior" style="margin-top:18px;">
        </div>
      </div>

    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
      <div class="modal-header">
        <h3 id="modalTitle">Mensaje</h3>
        <div><button id="closeModal" class="btn-small" style="background:#9e9e9e;color:#111;">Cerrar</button></div>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="../user-session.js"></script>
  <script src="../modo-oscuro.js"></script>
  <script src="../render-window.js"></script>
  <script src="../FSApiClient.js"></script>

  <script>
    // Foto de perfil solo frontend
    document.addEventListener('DOMContentLoaded', function() {
      var avatarImg = document.getElementById('avatarImg');
      var avatarInput = document.getElementById('avatarInput');
      var avatarFileName = document.getElementById('avatarFileName');
      // Cargar imagen guardada en localStorage
      var userPhoto = localStorage.getItem('fs_usuario_foto');
      if (userPhoto) {
        avatarImg.src = userPhoto;
      }
      // Mostrar nombre de archivo seleccionado
      avatarInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        avatarFileName.textContent = file.name;
        var reader = new FileReader();
        reader.onload = function(ev) {
          avatarImg.src = ev.target.result;
          localStorage.setItem('fs_usuario_foto', ev.target.result);
        };
        reader.readAsDataURL(file);
      });
      // Click en el label personalizado abre el input
      var customLabel = document.querySelector('.custom-file-label span');
      if (customLabel) {
        customLabel.addEventListener('click', function() {
          avatarInput.click();
        });
      }
    });
  </script>

    <script>
      // Foto de perfil solo frontend
      document.addEventListener('DOMContentLoaded', function() {
        var avatarImg = document.getElementById('avatarImg');
        var avatarInput = document.getElementById('avatarInput');
        // Cargar imagen guardada en localStorage
        var userPhoto = localStorage.getItem('fs_usuario_foto');
        if (userPhoto) {
          avatarImg.src = userPhoto;
        }
        // Al seleccionar nueva imagen
        avatarInput.addEventListener('change', function(e) {
          var file = e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function(ev) {
            avatarImg.src = ev.target.result;
            localStorage.setItem('fs_usuario_foto', ev.target.result);
          };
          reader.readAsDataURL(file);
        });
      });
    </script>
  
  <script>
    (function() {
      const API = window.FSApiClient;
      
      // Elementos del DOM
      const form = document.getElementById('profile-form');
      const btnEditarPerfil = document.getElementById('editarPerfil');
      const btnCerrarSesion = document.getElementById('cerrarSesion');
      const btnCambiarPassword = document.getElementById('cambiarPassword');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const closeModal = document.getElementById('closeModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalContent = document.getElementById('modalContent');
      
      // Usuario actual - obtener del localStorage
      let usuarioActual = null;
      try {
        const userData = localStorage.getItem('fs_usuario_actual');
        if (userData) {
          usuarioActual = JSON.parse(userData);
        } else {
          // Fallback si no hay datos completos
          usuarioActual = {
            idUsuario: 48,
            nombres: '',
            apellidos: '',
            correo: '',
            telefono: '',
            numeroDocumento: localStorage.getItem('documento') || '',
            tipoDocumento: '',
            cargo: localStorage.getItem('rol') || ''
          };
        }
      } catch (e) {
        console.error('Error al leer usuario:', e);
        usuarioActual = { idUsuario: 48, nombres: '', apellidos: '', correo: '', telefono: '', numeroDocumento: '', tipoDocumento: '', cargo: '' };
      }
      
      // Función para mostrar modal
      function mostrarModal(titulo, contenido) {
        modalTitle.textContent = titulo;
        modalContent.innerHTML = contenido;
        modalBackdrop.classList.add('open');
        modalBackdrop.setAttribute('aria-hidden', 'false');
      }
      
      function cerrarModalFunc() {
        modalBackdrop.classList.remove('open');
        modalBackdrop.setAttribute('aria-hidden', 'true');
      }
      
      closeModal.addEventListener('click', cerrarModalFunc);
      modalBackdrop.addEventListener('click', function(e) {
        if (e.target === modalBackdrop) cerrarModalFunc();
      });
      
      // Cargar datos del usuario desde el backend
      async function cargarDatosUsuario() {
        try {
          // Si no tenemos idUsuario, intentar obtener del localStorage completo
          if (!usuarioActual || !usuarioActual.idUsuario) {
            const storedUser = localStorage.getItem('fs_usuario_actual');
            if (storedUser) {
              usuarioActual = JSON.parse(storedUser);
            }
          }
          
          if (!usuarioActual || !usuarioActual.idUsuario) {
            throw new Error('No hay usuario logueado');
          }
          
          const response = await fetch(`http://localhost:8080/usuario/${usuarioActual.idUsuario}`);
          
          if (!response.ok) {
            throw new Error('Usuario no encontrado');
          }
          
          const usuario = await response.json();
          usuarioActual = usuario;
          
          // Actualizar localStorage con datos completos
          localStorage.setItem('fs_usuario_actual', JSON.stringify(usuario));
          
          // Llenar el formulario con los datos
          document.getElementById('nombre').value = usuario.nombres || '';
          document.getElementById('apellido').value = usuario.apellidos || '';
          document.getElementById('email').value = usuario.correo || '';
          document.getElementById('telefono').value = usuario.telefono || '';
          document.getElementById('tipoDocumento').value = usuario.tipoDocumento || '';
          document.getElementById('numeroDocumento').value = usuario.numeroDocumento || '';
          
          // Actualizar nombre en la card (NO en la bienvenida, eso lo hace user-session.js)
          document.querySelector('h3').textContent = `${usuario.nombres} ${usuario.apellidos}`;
          document.querySelector('.small-muted').textContent = usuario.cargo.charAt(0).toUpperCase() + usuario.cargo.slice(1);
          
        } catch (error) {
          console.error('Error al cargar usuario:', error);
          mostrarModal('Error', 'No se pudieron cargar los datos del usuario');
        }
      }
      
      // Guardar cambios del perfil
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const datosActualizados = {
          nombres: document.getElementById('nombre').value.trim(),
          apellidos: document.getElementById('apellido').value.trim(),
          correo: document.getElementById('email').value.trim(),
          telefono: document.getElementById('telefono').value.trim(),
          numeroDocumento: usuarioActual.numeroDocumento,
          tipoDocumento: usuarioActual.tipoDocumento,
          cargo: usuarioActual.cargo,
          contrasena: usuarioActual.contrasena // Mantener la contraseña actual
        };
        
        // Validaciones básicas
        if (!datosActualizados.nombres || !datosActualizados.apellidos) {
          mostrarModal('Error', 'El nombre y apellido son obligatorios');
          return;
        }
        
        if (!datosActualizados.correo || !datosActualizados.correo.includes('@')) {
          mostrarModal('Error', 'Ingresa un correo válido');
          return;
        }
        
        try {
          const response = await fetch(`http://localhost:8080/usuario/${usuarioActual.idUsuario}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(datosActualizados)
          });
          
          if (!response.ok) {
            const error = await response.text();
            throw new Error(error);
          }
          
          const usuarioActualizado = await response.json();
          usuarioActual = usuarioActualizado;
          
          // Actualizar localStorage
          localStorage.setItem('fs_usuario_actual', JSON.stringify(usuarioActualizado));
          
          mostrarModal('✅ Éxito', 'Perfil actualizado correctamente');
          
          // Actualizar interfaz (solo la card, la bienvenida la maneja user-session.js)
          document.querySelector('h3').textContent = `${usuarioActualizado.nombres} ${usuarioActualizado.apellidos}`;
          
          // Actualizar también la bienvenida con el nuevo nombre
          if (window.FSUserSession && typeof window.FSUserSession.updateUserName === 'function') {
            window.FSUserSession.updateUserName();
          }
          
        } catch (error) {
          console.error('Error al actualizar perfil:', error);
          mostrarModal('❌ Error', 'No se pudo actualizar el perfil: ' + error.message);
        }
      });
      
      // Cambiar contraseña
      btnCambiarPassword.addEventListener('click', function() {
        const contenido = `
          <div style="padding: 20px;">
            <div style="margin-bottom: 18px;">
              <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text); font-size: 14px;">Contraseña actual:</label>
              <input type="password" id="passwordActual" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: #ffffff; color: #1e293b; font-size: 14px; box-sizing: border-box; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'">
            </div>
            <div style="margin-bottom: 18px;">
              <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text); font-size: 14px;">Nueva contraseña:</label>
              <input type="password" id="passwordNueva" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: #ffffff; color: #1e293b; font-size: 14px; box-sizing: border-box; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'">
              <small style="color: #64748b; font-size: 12px; display: block; margin-top: 6px;">Mínimo 8 caracteres, incluir mayúscula, minúscula, número y carácter especial</small>
            </div>
            <div style="margin-bottom: 24px;">
              <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text); font-size: 14px;">Confirmar contraseña:</label>
              <input type="password" id="passwordConfirm" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #cbd5e1; background: #ffffff; color: #1e293b; font-size: 14px; box-sizing: border-box; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'">
            </div>
            <button id="btnGuardarPassword" class="btn" style="width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);">Cambiar contraseña</button>
          </div>
        `;
        
        mostrarModal('Cambiar contraseña', contenido);
        
        // Event listener para el botón de guardar
        setTimeout(() => {
          document.getElementById('btnGuardarPassword').addEventListener('click', async function() {
            const actual = document.getElementById('passwordActual').value;
            const nueva = document.getElementById('passwordNueva').value;
            const confirmar = document.getElementById('passwordConfirm').value;
            
            if (!actual || !nueva || !confirmar) {
              alert('Todos los campos son obligatorios');
              return;
            }
            
            if (actual !== usuarioActual.contrasena) {
              alert('La contraseña actual es incorrecta');
              return;
            }
            
            if (nueva !== confirmar) {
              alert('Las contraseñas no coinciden');
              return;
            }
            
            // Validar formato de contraseña
            const passwordRegex = /^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!¿?*.,:;_-]).{8,}$/;
            if (!passwordRegex.test(nueva)) {
              alert('La contraseña debe tener mínimo 8 caracteres, incluir mayúscula, minúscula, número y carácter especial');
              return;
            }
            
            try {
              const datosActualizados = {
                ...usuarioActual,
                contrasena: nueva
              };
              
              const response = await fetch(`http://localhost:8080/usuario/${usuarioActual.idUsuario}`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(datosActualizados)
              });
              
              if (!response.ok) {
                throw new Error('Error al cambiar contraseña');
              }
              
              usuarioActual.contrasena = nueva;
              cerrarModalFunc();
              mostrarModal('✅ Éxito', 'Contraseña cambiada correctamente');
              
            } catch (error) {
              console.error('Error:', error);
              alert('No se pudo cambiar la contraseña');
            }
          });
        }, 100);
      });
      
      // Cerrar sesión
      btnCerrarSesion.addEventListener('click', function() {
        if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
          // Limpiar datos de sesión
          localStorage.removeItem('fs_usuario_actual');
          // Redirigir al login
          window.location.href = 'login.html';
        }
      });
      
      // Modo edición del perfil
      let modoEdicion = false;
      btnEditarPerfil.addEventListener('click', function() {
        modoEdicion = !modoEdicion;
        
        const inputs = form.querySelectorAll('input');
        inputs.forEach(input => {
          input.disabled = !modoEdicion;
        });
        
        if (modoEdicion) {
          btnEditarPerfil.textContent = 'Cancelar';
          btnEditarPerfil.style.background = 'var(--danger)';
        } else {
          btnEditarPerfil.textContent = 'Editar';
          btnEditarPerfil.style.background = 'var(--accent)';
          cargarDatosUsuario(); // Recargar datos originales
        }
      });
      
      // Inicializar: cargar datos del usuario
      cargarDatosUsuario();
      
      // Desactivar inputs inicialmente
      const inputs = form.querySelectorAll('input');
      inputs.forEach(input => {
        input.disabled = true;
      });
      
    })();
  </script>
</body>
</html>
