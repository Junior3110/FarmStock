<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Perfil - FarmStock</title>
  <!-- Prevenir flashazo del modo oscuro -->
  <script>
    (function() {
      const saved = localStorage.getItem('fs_dark_mode');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldBeDark = saved === null ? prefersDark : saved === 'true';
      if (shouldBeDark) {
        document.documentElement.classList.add('dark-mode');
        document.body.classList.add('dark-mode');
      }
    })();
  </script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var user = null;
        try {
          user = JSON.parse(localStorage.getItem('fs_usuario_actual'));
        } catch(e) {}
        if (user && user.cargo === 'celador') {
          var menuItems = document.querySelectorAll('.menu-modulos li');
          menuItems.forEach(function(item) {
            var link = item.querySelector('a');
            if (
              !link.href.endsWith('equipos-computos.html') &&
              !link.href.endsWith('equipos-movimientos.html')
            ) {
              item.style.display = 'none';
            }
          });
        }
      });
    </script>
  <link rel="stylesheet" href="../CSS/index.css" />
  <link rel="stylesheet" href="../CSS/Notificaciones.css" />
</head>
<body>
  <div class="window-controls">
    <button id="minimize" title="Minimizar" type="button">─</button>
    <button id="maximize" title="Maximizar" type="button">▢</button>
    <button id="close" title="Cerrar" type="button">✕</button>
  </div>

  <div class="container">
    <!-- SIDEBAR: misma estructura que index.html -->
    <aside class="sidebar" style="border-radius: 12px;">
      <div class="top-section">
        <div class="logo"><img src="../imagenes/Logo.png" alt="Logo FarmStock" /></div>
        <ul class="menu-modulos">
          <li><a href="index.html">Registro Herramientas</a></li>
          <li><a href="registro-salida.html">Salida Herramientas</a></li>
          <li><a href="indexInventario.html">Inventario</a></li>
          <!-- <li><a href="Notificaciones.html">Notificaciones</a></li> -->
          <li><a href="estats.html">Estadísticas</a></li>
          <li><a href="registro-aprendices.html">Aprendices</a></li>
          <li><a href="equipos-computos.html">Equipos de Cómputo</a></li>
          <li><a href="equipos-movimientos.html">Movimientos Equipos</a></li>
        </ul>
      </div>

      <div class="sidebar-bottom">
        <a href="quienes-somos.html" class="somos">👥 Quiénes Somos</a>
        <div id="btnModoNoche" class="night-mode">🌙 Modo noche</div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="bienvenida">
        <a href="perfil.html"><img src="../imagenes/usuario.png" alt="Foto de usuario" class="foto-usuario" /></a>
        <p><strong>¡Hola Usuario!</strong></p>
      </div>

      <!-- PERFIL: tarjeta principal con formulario y actividad, usando clases de index.css -->
      <div class="area-superior">
        <div class="formulario-card">
          <div style="display:grid; grid-template-columns: 260px 1fr; gap:18px; align-items:start;">
            <!-- Columna izquierda: avatar + stats -->
            <div>
              <div class="card" style="padding:16px; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; border-radius: 20px;">
                <img id="avatarImg" src="../imagenes/usuario.png" alt="Avatar" style="width:96px; height:96px; border-radius:12px; object-fit:cover; box-shadow:var(--shadow-1);" />
                <label for="avatarInput" class="custom-file-label" style="display:block;margin-top:10px;">
                  <span style="display:inline-block;padding:10px 18px;background:linear-gradient(90deg,#3b82f6,#10b981);color:#fff;font-weight:700;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px rgba(16,185,129,0.10);transition:background 0.2s;">Cambiar foto de perfil</span>
                  <input type="file" id="avatarInput" accept="image/*" style="display:none;" />
                </label>
                <span id="avatarFileName" style="display:block;margin-top:6px;color:var(--muted);font-size:13px;"></span>
                <div>
                  <h3 style="margin:6px 0 0 0;">María Pérez</h3>
                  <div class="small-muted">Administrador</div>
                </div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                  <button id="editarPerfil" class="btn-small" style="background:#10b981; color:#fff; font-weight:600;">Editar</button>
                  <button id="cerrarSesion" class="btn-small delete" style="background:#ef4444; color:#fff; font-weight:600;">Cerrar sesión</button>
                </div>
              </div>
            </div>

            <!-- Columna derecha: formulario -->
            <div>
              <h3 style="margin-top:0">Información personal</h3>
              <form id="profile-form" class="formulario-horizontal" style="grid-template-columns: 1fr; gap:12px;" novalidate>
                <div class="columna">
                  <label for="nombre">Nombre</label>
                  <input id="nombre" name="nombre" type="text" value="María" placeholder="Nombre" style="border: 1px solid var(--card-border); background: var(--surface); color: var(--text); padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="apellido">Apellido</label>
                  <input id="apellido" name="apellido" type="text" value="Gafaro" placeholder="Apellido" style="border: 1px solid var(--card-border); background: var(--surface); color: var(--text); padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="email">Correo</label>
                  <input id="email" name="email" type="email" value="maria@ejemplo.com" placeholder="correo@dominio.com" style="border: 1px solid var(--card-border); background: var(--surface); color: var(--text); padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="telefono">Teléfono</label>
                  <input id="telefono" name="telefono" type="tel" placeholder="(+57) 300 000 0000" style="border: 1px solid var(--card-border); background: var(--surface); color: var(--text); padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="tipoDocumento">Tipo de documento</label>
                  <input id="tipoDocumento" name="tipoDocumento" type="text" readonly style="background: color-mix(in srgb, var(--surface) 90%, var(--card-border) 10%); border: 1px solid var(--card-border); color: var(--muted); cursor: not-allowed; padding: 10px; border-radius: 6px;" />
                </div>

                <div class="columna">
                  <label for="numeroDocumento">Número de documento</label>
                  <input id="numeroDocumento" name="numeroDocumento" type="text" readonly style="background: color-mix(in srgb, var(--surface) 90%, var(--card-border) 10%); border: 1px solid var(--card-border); color: var(--muted); cursor: not-allowed; padding: 10px; border-radius: 6px;" />
                </div>

                <div style="display:flex; gap:10px; margin-top:8px; justify-content:flex-end;">
                  <button type="submit" class="btn" style="background:#10b981; color:#fff; font-weight:600; border:none;">Guardar cambios</button>
                  <button type="button" id="cambiarPassword" class="btn" style="background:#3b82f6; color:#fff; border:none; font-weight:600;">Cambiar contraseña</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Actividad reciente -->
      <div class="area-inferior" style="margin-top:18px;">
        </div>
      </div>

    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
      <div class="modal-header">
        <h3 id="modalTitle">Mensaje</h3>
        <div><button id="closeModal" class="btn-small" style="background:#9e9e9e;color:#111;">Cerrar</button></div>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="../user-session.js"></script>
  <script src="../modo-oscuro.js"></script>
  <script src="../render-window.js"></script>
  <script src="../FSApiClient.js"></script>

  <script>
    (function() {
      const API = window.FSApiClient;
      
      // DOM Elements
      const form = document.getElementById('profile-form');
      const avatarImg = document.getElementById('avatarImg');
      const avatarInput = document.getElementById('avatarInput');
      const avatarFileName = document.getElementById('avatarFileName');
      const btnEditarPerfil = document.getElementById('editarPerfil');
      const btnCerrarSesion = document.getElementById('cerrarSesion');
      const btnCambiarPassword = document.getElementById('cambiarPassword');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const closeModal = document.getElementById('closeModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalContent = document.getElementById('modalContent');
      
      let usuarioActual = null;
      try {
        const userData = localStorage.getItem('fs_usuario_actual');
        if (userData) {
          usuarioActual = JSON.parse(userData);
        }
      } catch (e) {
        console.error('Error reading user:', e);
      }
      
      if (!usuarioActual || (!usuarioActual.idUsuario && !usuarioActual.id)) {
        window.location.href = 'login.html';
        return;
      }

      // Sync avatar from photo_perfil or localStorage
      function syncAvatar(fotoUrl) {
        if (fotoUrl) {
          avatarImg.src = fotoUrl;
        } else {
          const localPhoto = localStorage.getItem('fs_usuario_foto');
          if (localPhoto) avatarImg.src = localPhoto;
        }
      }
      
      // Modal helper
      function mostrarModal(titulo, contenido) {
        modalTitle.textContent = titulo;
        modalContent.innerHTML = contenido;
        modalBackdrop.classList.add('open');
        modalBackdrop.setAttribute('aria-hidden', 'false');
      }
      
      function cerrarModalFunc() {
        modalBackdrop.classList.remove('open');
        modalBackdrop.setAttribute('aria-hidden', 'true');
      }
      
      closeModal.addEventListener('click', cerrarModalFunc);
      modalBackdrop.addEventListener('click', (e) => {
        if (e.target === modalBackdrop) cerrarModalFunc();
      });
      
      // Handle Avatar Upload
      avatarInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        avatarFileName.textContent = file.name;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const base64 = ev.target.result;
          avatarImg.src = base64;
          // Store locally for now, will be sent on Save
          usuarioActual.fotoPerfil = base64;
          localStorage.setItem('fs_usuario_foto', base64);
        };
        reader.readAsDataURL(file);
      });

      const customLabel = document.querySelector('.custom-file-label span');
      if (customLabel) {
        customLabel.addEventListener('click', () => avatarInput.click());
      }
      
      // Data loading
      async function cargarDatosUsuario() {
        try {
          const id = usuarioActual.idUsuario || usuarioActual.id;
          const usuario = await API.obtenerUsuarioPorId(id);
          usuarioActual = usuario;
          
          localStorage.setItem('fs_usuario_actual', JSON.stringify(usuario));
          
          document.getElementById('nombre').value = usuario.nombres || '';
          document.getElementById('apellido').value = usuario.apellidos || '';
          document.getElementById('email').value = usuario.correo || '';
          document.getElementById('telefono').value = usuario.telefono || '';
          document.getElementById('tipoDocumento').value = usuario.tipoDocumento || '';
          document.getElementById('numeroDocumento').value = usuario.numeroDocumento || '';
          
          syncAvatar(usuario.fotoPerfil);

          document.querySelector('h3').textContent = `${usuario.nombres} ${usuario.apellidos}`;
          const cargoEl = document.querySelector('.small-muted');
          if (cargoEl && usuario.cargo) {
            cargoEl.textContent = usuario.cargo.charAt(0).toUpperCase() + usuario.cargo.slice(1);
          }
        } catch (error) {
          console.error('Error loading user:', error);
          // Fallback if API fails but we have localStorage
          document.getElementById('nombre').value = usuarioActual.nombres || '';
          document.getElementById('apellido').value = usuarioActual.apellidos || '';
          document.getElementById('email').value = usuarioActual.correo || '';
          document.getElementById('telefono').value = usuarioActual.telefono || '';
          document.getElementById('tipoDocumento').value = usuarioActual.tipoDocumento || '';
          document.getElementById('numeroDocumento').value = usuarioActual.numeroDocumento || '';
          syncAvatar(usuarioActual.fotoPerfil);
        }
      }
      
      // Update logic
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const payload = {
          nombres: document.getElementById('nombre').value.trim(),
          apellidos: document.getElementById('apellido').value.trim(),
          correo: document.getElementById('email').value.trim(),
          telefono: document.getElementById('telefono').value.trim(),
          fotoPerfil: usuarioActual.fotoPerfil || localStorage.getItem('fs_usuario_foto') || null
        };
        
        if (!payload.nombres || !payload.apellidos) {
          mostrarModal('Error', 'Nombre y apellido son obligatorios');
          return;
        }
        
        try {
          const id = usuarioActual.idUsuario || usuarioActual.id;
          const response = await API.actualizarUsuario(id, payload);
          usuarioActual = response.data;
          localStorage.setItem('fs_usuario_actual', JSON.stringify(usuarioActual));
          
          if (usuarioActual.fotoPerfil) {
             localStorage.setItem('fs_usuario_foto', usuarioActual.fotoPerfil);
          }

          mostrarModal('✅ Éxito', 'Perfil actualizado correctamente');
          document.querySelector('h3').textContent = `${usuarioActual.nombres} ${usuarioActual.apellidos}`;
          
          if (window.FSUserSession && typeof window.FSUserSession.updateUserName === 'function') {
            window.FSUserSession.updateUserName();
          }

          // Disable editing after save
          toggleEdicion(false);
          
        } catch (error) {
          console.error('Update error:', error);
          mostrarModal('❌ Error', 'No se pudo actualizar: ' + error.message);
        }
      });
      
      function toggleEdicion(enable) {
        const inputs = form.querySelectorAll('input:not([readonly])');
        inputs.forEach(i => i.disabled = !enable);
        
        if (enable) {
          btnEditarPerfil.textContent = 'Cancelar';
          btnEditarPerfil.classList.add('delete');
        } else {
          btnEditarPerfil.textContent = 'Editar';
          btnEditarPerfil.classList.remove('delete');
        }
        modoEdicion = enable;
      }

      let modoEdicion = false;
      btnEditarPerfil.addEventListener('click', () => {
        if (modoEdicion) {
          cargarDatosUsuario();
          toggleEdicion(false);
        } else {
          toggleEdicion(true);
        }
      });

      btnCerrarSesion.addEventListener('click', () => {
        if (confirm('¿Cerrar sesión?')) {
          localStorage.removeItem('fs_usuario_actual');
          window.location.href = 'login.html';
        }
      });

      btnCambiarPassword.addEventListener('click', () => {
         mostrarModal('Cambiar Contraseña', '<p style="padding:10px">Para cambiar tu contraseña, contacta al administrador o usa un flujo de recuperación (Próximamente).</p>');
      });
      
      // Init
      toggleEdicion(false);
      cargarDatosUsuario();
      
    })();
  </script>
</body>
</html>
