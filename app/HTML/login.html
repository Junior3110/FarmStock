<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmStock - Iniciar Sesión</title>

  <!-- Usar solo el CSS global para mantener el mismo tema -->
  <link rel="stylesheet" href="../CSS/index.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/index.css" /> <link rel="stylesheet" href="../CSS/modal-fixes.css" />

  <style>
    /* Card centrada y estética coherente con registro */
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 36px);
      padding: 28px;
      box-sizing: border-box;
      max-width: calc(var(--max-width-main, 1200px) + 40px);
      margin: 0 auto;
    }

    .login-card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border-radius: 14px;
      padding: 22px 28px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-1);
      box-sizing: border-box;
      position: relative;
    }

    .login-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brand img { height:54px; width:auto; display:block; } /* logo más grande */
    /* no text label, only logo as requested */

    .header-actions { display:flex; align-items:center; gap:12px; }

    .night-mode {
      padding: 8px 12px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--surface) 96%, transparent 4%);
      border: 1px solid var(--card-border);
      cursor: pointer;
      font-weight:700;
    }

    h1.login-title {
      margin: 8px 0 18px 0;
      font-size: 26px;
      color: var(--text);
      font-weight:900;
    }

    .form-grid {
      display:grid;
      gap:12px;
    }

    .input-group {
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    input[type="text"], input[type="password"], select {
      border: 1px solid var(--card-border);
      background: color-mix(in srgb, var(--surface) 96%, transparent 4%);
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
    }

    .actions-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:14px;
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--accent-400, #7bd07a), var(--accent-600, #3fa34a));
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight:800;
      cursor:pointer;
      box-shadow: 0 10px 24px rgba(63,163,74,0.12);
    }

    .btn-secondary {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: color-mix(in srgb, var(--surface) 96%, transparent 4%);
      color: var(--text);
      font-weight:700;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .helper {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .brand img { height:44px; }
      .login-card { padding:18px; }
    }
  </style>
</head>

<body>
  <div class="window-controls">
    <button id="minimize" title="Minimizar" type="button">
      <svg viewBox="0 0 10 10"><rect x="2" y="6" width="6" height="1" fill="currentColor"/></svg>
    </button>
    <button id="maximize" title="Maximizar" type="button">
      <svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button id="close" title="Cerrar" type="button">
      <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>

  <main class="login-page" role="main">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-header">
        <div class="brand" aria-hidden="false">
          <!-- logo only (bigger) -->
          <img src="../imagenes/Logo.png" alt="FarmStock logo" />
        </div>

        <div class="header-actions">
          <div class="night-mode" title="Alternar modo noche">
            <span id="btnModoNoche">🌙 Modo noche</span>
          </div>
        </div>
      </div>

      <h1 id="loginTitle" class="login-title">Iniciar sesión</h1>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="form-grid">
          <div class="input-group">
            <label for="documento">Documento de Identidad</label>
            <input id="documento" name="documento" type="text" placeholder="Número de documento" required>
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required>
          </div>

          <div class="input-group">
            <label for="rol">Cargo</label>
            <select id="rol" name="rol" required>
              <option value="">Selecciona tu cargo</option>
              <option value="administrador">Administrador</option>
              <option value="instructor">Instructor</option>
            </select>
          </div>

          <div class="actions-row">
            <a class="btn-secondary" href="registro-persona.html" id="btnRegistro">Registrarme</a>
            <div style="display:flex;gap:12px;align-items:center;">
              <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </div>
          </div>

          <p class="helper">¿Olvidaste tu contraseña? Contacta al administrador.</p>
        </div>
      </form>
    </section>
  </main>

  <script>
    // Simple login demo script (front-end only)
    (function () {
      const form = document.getElementById('loginForm');
      if (!form) return;

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        // Basic validation
        const doc = document.getElementById('documento').value.trim();
        const pwd = document.getElementById('password').value;
        if (!doc || !pwd) { alert('Por favor completa documento y contraseña.'); return; }
        // Simulate success
        alert('Inicio de sesión (demo).');
        form.reset();
      });
    })();
  </script>

  <script src="../modo-oscuro.js"></script>
  <script src="../render-window.js"></script>
</body>

</html>
