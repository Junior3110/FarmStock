<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - FarmStock</title>
    <link rel="stylesheet" href="../CSS/registro-persona.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="window-controls">
        <button id="minimize" title="Minimizar">
            <svg viewBox="0 0 10 10">
                <rect x="2" y="6" width="6" height="1" fill="currentColor"/>
            </svg>
        </button>

        <button id="maximize" title="Maximizar">
            <svg viewBox="0 0 10 10">
                <rect x="2" y="2" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1"/>
            </svg>
        </button>

        <button id="close" title="Cerrar">
            <svg viewBox="0 0 10 10">
                <line x1="2" y1="2" x2="8" y2="8" stroke="currentColor" stroke-width="1.5"/>
                <line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </button>
    </div>

    <div class="container">
        <div class="left">
            <div class="logo">
                <img src="../imagenes/Logo.png" alt="FarmStock Logo" />
            </div>

            <h1>Registro</h1>

            <form id="registroForm">
                <input type="text" placeholder="Nombres" name="nombres" required />
                <input type="text" placeholder="Apellidos" name="apellidos" required />
                <input type="email" placeholder="Correo electrónico" name="correo" required />
                <input type="tel" placeholder="Teléfono" name="telefono" required />

                <select name="cargo" required>
                    <option value="">Cargo</option>
                    <option value="aprendiz">Aprendiz</option>
                    <option value="instructor">Instructor</option>
                    <option value="administrador">Administrador</option>
                </select>

                <select name="tipo_documento" required>
                    <option value="">Tipo de documento</option>
                    <option value="CC">Cédula de ciudadanía</option>
                    <option value="TI">Tarjeta de identidad</option>
                    <option value="PPT">PPT</option>
                </select>

                <input type="text" placeholder="Número de documento" name="numero_documento" required />
                <input type="password" placeholder="Contraseña" name="password" required />
                <input type="password" placeholder="Confirmar contraseña" name="confirm_password" required />

                <button type="submit">Registrarme</button>
            </form>

            <div class="volver-login">
                ¿Ya tienes cuenta? <a href="../HTML/login.html">Iniciar sesión</a>
            </div>
        </div>

        <div class="right">
            <img src="../imagenes/finca_sena.webp" alt="Imagen de la finca" />
        </div>
    </div>

    <!-- ⚙️ Archivos JavaScript -->
    <script>
        const API_URL = "http://localhost:8080/usuario";

document.getElementById("registroForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const datos = new FormData(form);
  const f = Object.fromEntries(datos);

  const pass = f.password || "";
  const confirm = f.confirm_password || "";
  if (pass !== confirm) {
    alert("❌ Las contraseñas no coinciden");
    return;
  }

  const payload = {
    nombres: f.nombres?.trim(),
    apellidos: f.apellidos?.trim(),
    correo: f.correo?.trim(),
    telefono: f.telefono?.trim(),
    numeroDocumento: f.numero_documento?.trim(),
    contrasena: pass,
    cargo: f.cargo?.trim(),
    tipoDocumento: f.tipo_documento?.trim()
  };

  console.log("➡️ Enviando a backend:", payload);

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    console.log("⬅️ Respuesta:", res.status, text);

    if (res.ok) {
      alert("✅ Usuario registrado correctamente");
      form.reset();
    } else {
      alert(`⚠️ Error (${res.status}): ${text}`);
    }
  } catch (err) {
    console.error("💥 Error de conexión:", err);
    alert("🚫 No se pudo conectar con el servidor.");
  }
});

    </script>
</body>

</html>
