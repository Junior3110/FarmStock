<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - FarmStock</title>

  <!-- Hoja global para mantener tema y modo noche coherente -->
  <link rel="stylesheet" href="../CSS/index.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/index.css" /> <link rel="stylesheet" href="../CSS/modal-fixes.css" />

  <style>
    /* Centrado del formulario en el panel */
    .registro-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 36px);
      padding: 28px;
      box-sizing: border-box;
      max-width: calc(var(--max-width-main, 1200px) + 40px);
      margin: 0 auto;
    }

    .registro-card {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border-radius: 14px;
      padding: 28px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-1);
      box-sizing: border-box;
      position: relative;
    }

    /* Header: logo left, actions right */
    .registro-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .site-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* Logo enlarged and only logo shown (no text) */
    .site-brand img {
      height: 56px; /* increased size to make it stand out */
      width: auto;
      display: block;
    }

    /* Right-aligned actions (modo noche) */
    .top-actions {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .night-mode {
      padding: 8px 12px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--surface) 96%, transparent 4%);
      border: 1px solid var(--card-border);
      cursor: pointer;
      font-weight:700;
    }

    /* Title */
    .registro-card h1 {
      margin: 8px 0 18px 0;
      font-size: 28px;
      color: var(--text);
      font-weight: 900;
    }

    /* Form grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-grid .full { grid-column: 1 / -1; }

    .input-group-plain {
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    /* Button primary */
    .btn-primary {
      background: linear-gradient(180deg, var(--accent-400, #7bd07a), var(--accent-600, #3fa34a));
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight:800;
      cursor:pointer;
      box-shadow: 0 10px 24px rgba(63,163,74,0.12);
    }

    /* Back button bottom-left inside card */
    .back-btn {
      position: absolute;
      left: 18px;
      bottom: 18px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:8px;
      background: color-mix(in srgb, var(--surface) 96%, transparent 4%);
      border:1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      font-weight:700;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
    }
    .back-btn:hover { transform: translateY(-2px); }

    /* Inputs consistent with global theme */
    input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select, textarea {
      border: 1px solid var(--card-border);
      background: color-mix(in srgb, var(--surface) 96%, transparent 4%);
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
    }
    textarea { min-height: 110px; resize: vertical; }

    @media (max-width: 920px) {
      .form-grid { grid-template-columns: 1fr; }
      .registro-card { padding: 20px; }
      .back-btn { left: 12px; bottom: 12px; }
      /* show slightly smaller logo on small screens */
      .site-brand img { height: 44px; }
    }
  </style>
</head>

<body>
  <div class="window-controls">
    <button id="minimize" title="Minimizar">
      <svg viewBox="0 0 10 10"><rect x="2" y="6" width="6" height="1" fill="currentColor"/></svg>
    </button>
    <button id="maximize" title="Maximizar">
      <svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button id="close" title="Cerrar">
      <svg viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>

  <main class="registro-page" role="main">
    <section class="registro-card" aria-labelledby="registroTitle">
      <!-- Header: only logo left + night-mode right -->
      <div class="registro-header" role="region" aria-label="Encabezado de registro">
        <div class="site-brand" aria-hidden="false">
          <img src="../imagenes/Logo.png" alt="FarmStock logo" />
        </div>

        <div class="top-actions" aria-hidden="false">
          <div class="night-mode" title="Alternar modo noche">
            <span id="btnModoNoche">🌙 Modo noche</span>
          </div>
        </div>
      </div>

      <h1 id="registroTitle">Crear cuenta</h1>

      <form id="registroForm" autocomplete="on" novalidate>
        <div class="form-grid">
          <div class="input-group-plain">
            <label for="nombres">Nombres</label>
            <input id="nombres" name="nombres" type="text" placeholder="Nombres completos" required>
          </div>

          <div class="input-group-plain">
            <label for="apellidos">Apellidos</label>
            <input id="apellidos" name="apellidos" type="text" placeholder="Apellidos" required>
          </div>

          <div class="input-group-plain">
            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" required>
          </div>

          <div class="input-group-plain">
            <label for="telefono">Teléfono</label>
            <input id="telefono" name="telefono" type="tel" placeholder="+57 300 000 0000">
          </div>

          <div class="input-group-plain">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo" required>
              <option value="">Cargo</option>
              <option value="instructor">Instructor</option>
              <option value="administrador">Administrador</option>
            </select>
          </div>

          <div class="input-group-plain">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required>
          </div>

          <div class="input-group-plain">
            <label for="confirm_password">Confirmar contraseña</label>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="••••••••" required>
          </div>

          <div class="full" style="display:flex;justify-content:flex-end;align-items:center;">
            <button type="submit" class="btn-primary">Registrarme</button>
          </div>
        </div>
      </form>

      <!-- Back button to login panel -->
      <a class="back-btn" href="login.html" title="Volver al login">← Atrás</a>
    </section>
  </main>

  <script>
    // Client-side logic: password match + demo submission
    (function () {
      const form = document.getElementById('registroForm');
      if (!form) return;

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        const pwd = document.getElementById('password').value || '';
        const cpwd = document.getElementById('confirm_password').value || '';

        if (pwd !== cpwd) {
          alert('Las contraseñas no coinciden. Por favor verifica.');
          return;
        }

        // Simulate submission (replace with real fetch to backend)
        alert('Registro completado (demo).');
        form.reset();
      });
    })();
  </script>

  <script src="../modo-oscuro.js"></script>
  <script src="../render-window.js"></script>
</body>

</html>
